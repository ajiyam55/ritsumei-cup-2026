<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ページ - 立命杯2026</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 8px 8px 0;
      background: #f4f0ee;
      border-bottom: 1px solid #d4cdd0;
    }

    .tab {
      padding: 10px 18px;
      color: #777176;
      background: transparent;
      border: 0;
      border-radius: 8px 8px 0 0;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .tab.is-active {
      color: #7b1e24;
      background: #fff;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <nav class="tabs" role="tablist" aria-label="管理メニュー">
    <button class="tab is-active" type="button" data-target="tournament.html?admin=1" role="tab" aria-selected="true">トーナメント管理</button>
    <button class="tab" type="button" data-target="call.html" role="tab" aria-selected="false">呼び出し画面(ブロック戦)</button>
    <button class="tab" type="button" data-target="banner.html" role="tab" aria-selected="false">バナー自動生成</button>
  </nav>
  <iframe id="admin-frame" src="tournament.html?admin=1" title="管理画面"></iframe>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const frame = document.getElementById("admin-frame");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(other => {
          other.classList.toggle("is-active", other === tab);
          other.setAttribute("aria-selected", other === tab ? "true" : "false");
        });
        frame.src = tab.dataset.target;
      });
    });
  </script>
</body>
</html>
