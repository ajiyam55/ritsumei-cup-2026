<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aブロック管理 - 立命杯2026</title>
  <style>
    :root { --primary: #7b1e24; --line: #ddd3d4; --muted: #756d70; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f4f0ee; color: #282326; font-family: "Yu Gothic", sans-serif; }
    main { width: min(980px, 100%); margin: 0 auto; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    h1 { margin: 0; font-size: 1.8rem; }
    p { color: var(--muted); }
    .settings, .match-list { padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 18px rgb(75 36 40 / 8%); }
    .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    label { display: grid; gap: 5px; color: var(--muted); font-size: .82rem; }
    input { width: 100%; min-height: 38px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    input[type="number"] { text-align: center; }
    .match { display: grid; grid-template-columns: 70px 1fr 82px 24px 1fr 82px; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee9e9; }
    .match:last-child { border-bottom: 0; }
    .match-title { color: var(--muted); font-size: .78rem; }
    .team-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vs { text-align: center; color: var(--muted); font-size: .8rem; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; }
    button { min-height: 42px; padding: 8px 18px; color: #fff; background: var(--primary); border: 0; border-radius: 6px; font: inherit; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin: 0; font-size: .85rem; }
    .error { color: #a62929 !important; }
    @media (max-width: 680px) {
      body { padding: 14px; }
      header { align-items: start; flex-direction: column; }
      .settings { grid-template-columns: 1fr; }
      .match { grid-template-columns: 52px minmax(0, 1fr) 58px; gap: 6px; }
      .match .vs { display: none; }
      .match input[type="number"]:last-child { grid-column: 3; grid-row: 1; }
      .match .team-name:nth-of-type(2) { grid-column: 1 / 3; grid-row: 2; }
    }
  </style>
</head>
<body>
  <script>
    window.location.replace("tournament.html?admin=1");
  </script>
  <main>
    <header>
      <div>
        <h1>Aブロック管理</h1>
        <p>スコアを入力して保存すると、公開トーナメント表へ反映されます。</p>
      </div>
      <a href="tournament.html">公開表を見る</a>
    </header>

    <section class="settings">
      <label>Apps Script URL
        <input id="api-url" type="url" value="https://script.google.com/macros/s/AKfycbxJIETSf8wIwjB5VqoAeee4gTh1vfZWrqwzh5Vue4_sc1q-460GXgsLGR_3EKbNiXZA3Q/exec">
      </label>
      <label>管理トークン
        <input id="token" type="password" autocomplete="off">
      </label>
    </section>

    <section id="match-list" class="match-list"></section>
    <div class="actions">
      <p id="status">試合データを読み込み中です。</p>
      <button id="save" type="button">スコアを保存</button>
    </div>
  </main>

  <script>
    const ROUND_NAMES = ["1回戦", "2回戦", "準々決勝", "準決勝", "決勝"];
    let matches = [];
    let bracketSize = 16;

    function matchNumber(match) {
      let offset = 0;
      for (let round = 0; round < match.round; round += 1) {
        offset += bracketSize / (2 ** (round + 1));
      }
      return offset + match.match;
    }

    function teamName(team) {
      if (!team || !team.name) return "出場者未定";
      return `${team.number ? `${team.number}番 ` : ""}${team.name}`;
    }

    function render() {
      document.getElementById("match-list").innerHTML = matches.map((match, index) => `
        <div class="match" data-index="${index}">
          <span class="match-title">第${matchNumber(match)}試合<br>${ROUND_NAMES[match.round]}</span>
          <span class="team-name">${teamName(match.red)}</span>
          <input class="red-score" type="number" min="0" inputmode="numeric" value="${match.red?.score ?? ""}" aria-label="赤スコア">
          <span class="vs">VS</span>
          <span class="team-name">${teamName(match.blue)}</span>
          <input class="blue-score" type="number" min="0" inputmode="numeric" value="${match.blue?.score ?? ""}" aria-label="青スコア">
        </div>
      `).join("");
    }

    async function load() {
      const url = document.getElementById("api-url").value.trim();
      if (!url) return;
      try {
        const response = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        bracketSize = data.bracketSize || 16;
        matches = data.matches?.length ? data.matches : (data.A?.matches || []);
        render();
        document.getElementById("status").textContent = `${matches.length}試合を読み込みました。`;
      } catch (error) {
        document.getElementById("status").textContent = `読み込み失敗: ${error.message}`;
        document.getElementById("status").classList.add("error");
      }
    }

    async function save() {
      const button = document.getElementById("save");
      const url = document.getElementById("api-url").value.trim();
      const token = document.getElementById("token").value;
      const rows = [...document.querySelectorAll(".match")].map((element, index) => ({
        round: matches[index].round,
        match: matches[index].match,
        redNumber: matches[index].red?.number || "",
        redName: matches[index].red?.name || "",
        redScore: element.querySelector(".red-score").value,
        blueNumber: matches[index].blue?.number || "",
        blueName: matches[index].blue?.name || "",
        blueScore: element.querySelector(".blue-score").value
      }));

      button.disabled = true;
      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ token, matches: rows })
        });
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        document.getElementById("status").textContent = `${data.saved}試合を保存しました。`;
        document.getElementById("status").classList.remove("error");
      } catch (error) {
        document.getElementById("status").textContent = `保存失敗: ${error.message}`;
        document.getElementById("status").classList.add("error");
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("save").addEventListener("click", save);
    load();
  </script>
</body>
</html>
