<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バナー作成 - 立命杯2026</title>
  <script src="settings.js?v=20261125"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1e24;
      --ink: #242124;
      --muted: #777176;
      --line: #e3dcde;
    }

    html, body {
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      padding: 64px clamp(12px, 3vw, 28px) 40px;
    }

    .page {
      width: min(820px, 100%);
      margin: 0 auto;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 24px;
      z-index: 10;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgb(65 25 28 / 18%);
    }

    .back-button:hover {
      background-color: #a54c52;
    }

    /* 管理者ページのタブ内(iframe)で開いているときは、タブ列側に戻るボタンがあるので重複表示しない */
    html.is-embedded .back-button {
      display: none;
    }

    @media (max-width: 520px) {
      .back-button {
        left: 14px;
      }
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .notice {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .notice strong {
      color: var(--ink);
    }

    .switch-court-link {
      display: inline-block;
      margin-top: 4px;
      color: var(--primary);
      font-weight: bold;
      text-decoration: underline;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin: 14px 0 22px;
      padding: 10px 14px;
      background: #f7f4f5;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .status-line .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4caf50;
    }

    .status-line.is-paused .dot {
      background: var(--muted);
    }

    .status-line .buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .pill-button {
      padding: 6px 14px;
      color: var(--primary);
      background: #fff;
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .pill-button:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    /* コート選択画面(?court= なしで開いたとき) */
    .chooser {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .chooser a {
      display: block;
      padding: 18px;
      text-align: center;
      color: var(--primary);
      background: #f7f4f5;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
    }

    .court-block {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .court-block-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .court-block-head h2 {
      font-size: 1.3rem;
    }

    .save-now {
      margin-left: auto;
      padding: 6px 14px;
      color: var(--primary);
      background: #fff;
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .save-now:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    /* 実際に画像として書き出す「バナー」本体(画面下三分の一のテロップ想定) */
    /* ---- 配信(YouTube)に重ねる画像: 1920×1080 固定。透過部分は何も描かない ---- */
    .frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      background: transparent;
      color: #fff;
      font-weight: bold;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }
    .frame .panel {
      position: absolute;
      background: linear-gradient(90deg, rgba(36,33,36,0.94), rgba(36,33,36,0.8));
      border-radius: 8px;
    }
    /* 左上: コート・ブロック(回戦)・試合 */
    /* 黒い枠。動画をはめる窓(x:24〜1564 / y:24〜890 = 1540×866 の16:9)だけは何も描かず透過にする */
    .f-black { position: absolute; background: #000; }
    .f-info { left: 48px; top: 48px; display: flex; align-items: center; gap: 20px; padding: 14px 26px; font-size: 44px; }
    .f-info .court-tag { padding: 0.2em 0.6em; background: var(--primary); border-radius: 6px; font-size: 0.9em; white-space: nowrap; }
    .f-info .round-tag { color: #e7dfe0; font-size: 0.7em; line-height: 1.25; white-space: nowrap; }
    /* 右: スケジュール(幅は全体の15%) */
    .f-sched { left: 1588px; top: 24px; width: 308px; height: 866px; padding: 22px 20px; overflow: hidden; font-size: 22px; }
    .f-sched h4 { margin-bottom: 16px; color: #c8c1c3; font-size: 0.9em; }
    .f-sched ol { list-style: none; }
    .f-sched li { display: flex; gap: 12px; margin-bottom: 14px; line-height: 1.3; }
    .f-sched li b { flex: 0 0 auto; min-width: 3.2em; color: #ffd0d3; }
    .f-sched li span { min-width: 0; word-break: break-word; }
    /* 下: 対戦(名前だけ・1行) */
    .f-bar { left: 24px; right: 24px; bottom: 24px; height: 150px; display: flex; align-items: center; gap: 40px; padding: 0 50px; }
    .f-bar .team { flex: 1 1 0; min-width: 0; overflow: hidden; white-space: nowrap; text-align: center; font-size: 96px; line-height: 1.25; }
    .f-bar .team.red { color: #ff8a7a; }
    .f-bar .team.blue { color: #86b6ff; }
    .f-bar .vs { flex: 0 0 auto; color: #c8c1c3; font-size: 56px; }

    /* 画面でのプレビュー(透過が分かるよう市松模様) */
    .preview-wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--line); border-radius: 8px;
      background: #d9d9d9 conic-gradient(#fff 25%, transparent 0 50%, #fff 0 75%, transparent 0) 0 0 / 24px 24px; }
    .preview-wrap .frame { position: absolute; left: 0; top: 0; transform-origin: top left; }
    .schedule-box { margin: 14px 0; }
    .schedule-box label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 0.85rem; font-weight: bold; }
    .schedule-box textarea { width: 100%; min-height: 110px; padding: 8px 10px; font: inherit; font-size: 0.95rem; line-height: 1.5; border: 1px solid var(--line); border-radius: 6px; }
    .log-table tr[data-row] { cursor: pointer; }
    .log-table tr.is-preview td { background: #f6ebec; }

    .log-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 16px 0 6px;
    }

    .log-head h3 {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .log-head .buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .log-table th, .log-table td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .log-table th {
      color: var(--muted);
      font-weight: normal;
    }

    .log-empty {
      color: var(--muted);
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <a id="back-button" class="back-button" href="index.html" target="_top">← 戻る</a>
  <script>
    if (window.self !== window.top) {
      document.documentElement.classList.add("is-embedded");
    }
  </script>
  <main class="page" id="page"></main>

  <script>
    let API_BASE_URL = ""; // documents/settings.txt の apiUrl を読み込み後に入れる
    // Code.gs 側の BANNER_TOKEN と同じ値にしてください(スコアを書き換えられる管理者パスワードとは別物)。
    const BANNER_TOKEN = "banner-log-2026";
    const COURTS = {
      A: { label: "Aコート" },
      B: { label: "Bコート" },
      C: { label: "Cコート" }
    };

    const courtKey = new URLSearchParams(window.location.search).get("court");

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    // コート指定が無ければ、リングごとに開くための選択画面だけを出す
    if (!courtKey || !COURTS[courtKey]) {
      document.getElementById("page").innerHTML = `
        <h1>バナー作成</h1>
        <p class="notice">リングごとに別のパソコン・別のタブで開けるように、コートごとのページに分けています。該当するコートを選んでください。</p>
        <div class="chooser">
          ${Object.entries(COURTS).map(([key, court]) => `<a href="banner.html?court=${key}">${court.label}用を開く</a>`).join("")}
        </div>
      `;
    } else {
      window.RRST_SETTINGS_READY.then(() => {
        API_BASE_URL = window.RRST_SETTINGS.apiUrl;
        runCourtPage(courtKey);
      });
    }

    function runCourtPage(key) {
      const label = COURTS[key].label;
      document.title = `${label} バナー作成 - 立命杯2026`;
      document.getElementById("page").innerHTML = `
        <h1>${label} バナー作成</h1>
        <p class="notice">
          ${label}の全試合(リーグ戦とトーナメント)の対戦カードを1回だけ読み込みます(自動更新はしません)。
          <strong>「まとめてダウンロード」を押すと、全試合ぶんのバナー画像をこの場で作り、フォルダ入りのZIPファイルとして保存します。</strong>
          トーナメントは、対戦相手が決まった試合から順にバナーにできます(勝ち上がりが決まったら「読み込み直す」を押してください)。
          組み合わせを直したときも、「読み込み直す」を押してください。
          <br><a class="switch-court-link" href="banner.html">他のコートを選び直す</a>
        </p>
        <div class="status-line" id="status-line">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">読み込み中…</span>
          <div class="buttons">
            <button class="pill-button" id="reload-button" type="button">読み込み直す</button>
            <button class="pill-button" id="swap-all-button" type="button">全試合の左右を入れ替え</button>
            <button class="pill-button" id="batch-download-button" type="button" disabled>まとめてダウンロード</button>
          </div>
        </div>
        <div class="schedule-box">
          <label for="schedule-input">スケジュール(右側に表示)。1行に1つ「時間 内容」の形で入力。このブラウザに保存されます</label>
          <textarea id="schedule-input" placeholder="10:00 開会式&#10;10:30 リーグ戦&#10;12:00 休憩&#10;13:00 トーナメント" spellcheck="false"></textarea>
        </div>
        <div class="preview-wrap" id="preview-wrap"></div>
        <div id="list-area"></div>
      `;

      let matches = []; // バナーにできる試合(両方の機体が決まっているもの)。kind は "league" か "tournament"
      const KIND_LABEL = { league: "リーグ戦", tournament: "トーナメント" };

      // トーナメントの回戦名(tournament.html と同じ決め方。ブロック内は準決勝どまり)
      function roundNamesOf(bracketSize) {
        const total = Math.log2(bracketSize);
        const fromEnd = ["準決勝", "準々決勝"];
        return Array.from({ length: total }, (_, round) => fromEnd[total - 1 - round] || `${round + 1}回戦`);
      }

      // バナーの「第Nブロック / 第N試合」「準々決勝 / 第N試合」の部分
      function roundTagOf(m) {
        return `${escapeHtml(m.kind === "league" ? "第" + m.block + "ブロック" : m.roundName)}<br>第${escapeHtml(m.num)}試合`;
      }

      function teamName(team) {
        return !team || !team.name || team.name === "未設定" ? "" : team.name;
      }

      // ---- 左右入れ替え(試合ごとに記憶。このブラウザに保存) ----
      const SWAP_STORAGE_KEY = `rrstBannerSwap_${key}`;
      const SCHEDULE_STORAGE_KEY = "rrstBannerSchedule"; // スケジュールは全コート共通
      let swapped = {};
      try { swapped = JSON.parse(localStorage.getItem(SWAP_STORAGE_KEY) || "{}") || {}; } catch (ignore) { swapped = {}; }
      function matchKeyOf(m) { return `${m.kind}-${m.num}`; }
      function sidesOf(m) {
        return swapped[matchKeyOf(m)] ? { red: m.blue, blue: m.red } : { red: m.red, blue: m.blue };
      }

      let previewIndex = 0;

      function scheduleText() { return document.getElementById("schedule-input").value; }

      function scheduleHtml() {
        const items = scheduleText().split(/\r?\n/).map(line => line.trim()).filter(Boolean);
        if (!items.length) return "";
        const rows = items.map(line => {
          const hit = line.match(/^(\d{1,2}[:：]\d{2})\s*(.*)$/);
          return hit
            ? `<li><b>${escapeHtml(hit[1].replace("：", ":"))}</b><span>${escapeHtml(hit[2])}</span></li>`
            : `<li><span>${escapeHtml(line)}</span></li>`;
        }).join("");
        return `<aside class="panel f-sched"><h4>スケジュール</h4><ol>${rows}</ol></aside>`;
      }

      // 1920×1080 の画像1枚ぶんのHTML。透過にしたい部分には何も置かない
      function frameHtml(m) {
        const sides = sidesOf(m);
        return `<div class="frame">
          <div class="f-black" style="left:0;top:0;width:1920px;height:24px"></div>
          <div class="f-black" style="left:0;top:24px;width:24px;height:866px"></div>
          <div class="f-black" style="left:1564px;top:24px;width:356px;height:866px"></div>
          <div class="f-black" style="left:0;top:890px;width:1920px;height:190px"></div>
          <div class="panel f-info"><span class="court-tag">${escapeHtml(label)}</span><span class="round-tag">${roundTagOf(m)}</span></div>
          ${scheduleHtml()}
          <div class="panel f-bar">
            <span class="team red">${escapeHtml(sides.red)}</span>
            <span class="vs">VS</span>
            <span class="team blue">${escapeHtml(sides.blue)}</span>
          </div>
        </div>`;
      }

      // 名前を1行に収める。枠に入るまで文字を縮める(短い名前は大きいまま)
      function fitFrameNames(frameEl) {
        frameEl.querySelectorAll(".f-bar .team").forEach(el => {
          el.style.fontSize = "";
          let fontSize = parseFloat(getComputedStyle(el).fontSize);
          while (el.scrollWidth > el.clientWidth && fontSize > 20) {
            fontSize -= 2;
            el.style.fontSize = fontSize + "px";
          }
        });
      }

      function renderPreview() {
        const wrap = document.getElementById("preview-wrap");
        const m = matches[previewIndex];
        if (!m) { wrap.innerHTML = ""; return; }
        wrap.innerHTML = frameHtml(m);
        const frameEl = wrap.firstElementChild;
        frameEl.style.transform = `scale(${wrap.clientWidth / 1920})`;
        fitFrameNames(frameEl);
      }

      function setStatus(text, paused) {
        document.getElementById("status-text").textContent = text;
        document.getElementById("status-line").classList.toggle("is-paused", Boolean(paused));
      }

      function pad3(n) { return String(n).padStart(3, "0"); }

      function renderList() {
        const area = document.getElementById("list-area");
        if (!matches.length) {
          area.innerHTML = `<p class="log-empty">バナーにできる試合がありません。</p>`;
          renderPreview();
          return;
        }
        const rows = matches.map((m, i) => {
          const sides = sidesOf(m);
          return `<tr data-row="${i}" class="${i === previewIndex ? "is-preview" : ""}">
          <td>${escapeHtml(KIND_LABEL[m.kind])}</td>
          <td>${escapeHtml(m.kind === "league" ? "第" + m.block + "ブロック" : m.roundName)}</td>
          <td>第${escapeHtml(m.num)}試合</td>
          <td>${escapeHtml(sides.red)} VS ${escapeHtml(sides.blue)}</td>
          <td><button class="pill-button" type="button" data-swap="${i}">左右入れ替え</button>
              <button class="pill-button" type="button" data-one="${i}">1枚保存</button></td>
        </tr>`;
        }).join("");
        area.innerHTML = `<table class="log-table">
          <thead><tr><th>種類</th><th>ブロック/回戦</th><th>試合</th><th>対戦(行を押すと上にプレビュー)</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
        renderPreview();
      }

      // 1試合ぶんの画像(1920×1080・背景は透過)を画面の外で組み立てて、PNG(Blob)にする
      async function renderBannerBlob(match) {
        const holder = document.createElement("div");
        holder.style.cssText = "position:fixed;left:-9999px;top:0;width:1920px;height:1080px";
        holder.innerHTML = frameHtml(match);
        document.body.appendChild(holder);
        try {
          const frameEl = holder.querySelector(".frame");
          fitFrameNames(frameEl);
          const canvas = await html2canvas(frameEl, { backgroundColor: null, scale: 1, width: 1920, height: 1080 });
          const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
          if (!blob) throw new Error("画像の作成に失敗しました");
          return blob;
        } finally {
          holder.remove();
        }
      }

      function fileNameOf(match) {
        return match.kind === "league"
          ? `${label}_リーグ_${pad3(match.num)}_第${match.block}ブロック.png`
          : `${label}_トーナメント_${pad3(match.num)}_${match.roundName}.png`;
      }

      function saveBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      async function fetchJson(params) {
        const url = new URL(API_BASE_URL);
        Object.keys(params).forEach(name => url.searchParams.set(name, params[name]));
        const response = await fetch(url.toString(), { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = JSON.parse(await response.text());
        if (data.error) throw new Error(data.error);
        return data;
      }

      async function load() {
        const button = document.getElementById("batch-download-button");
        button.disabled = true;
        setStatus("読み込み中…", false);
        try {
          const leagueOnly = window.RRST_SETTINGS.mode !== "tournamentOnly"; // リーグ無しの年は、リーグ戦を読まない
          const [leagueData, tournamentData] = await Promise.all([
            leagueOnly ? fetchJson({ mode: "banners", court: key, token: BANNER_TOKEN }) : Promise.resolve({ matches: [] }),
            fetchJson({ mode: "tournament", league: key })
          ]);

          const league = (leagueData.matches || []);
          const leagueReady = league
            .filter(m => teamName(m.red) && teamName(m.blue))
            .map(m => ({ kind: "league", num: m.num, block: m.block, red: teamName(m.red), blue: teamName(m.blue) }));

          // トーナメント: 実際に戦う試合(シード・空き枠でない)で、両方の機体が決まっているもの
          const names = roundNamesOf(tournamentData.bracketSize || 2);
          const tournament = (tournamentData.matches || []).filter(m => m.number && !m.bye && !m.dead);
          const tournamentReady = tournament
            .filter(m => m.red && m.blue && !m.red.pending && !m.blue.pending && teamName(m.red) && teamName(m.blue))
            .sort((x, y) => x.number - y.number)
            .map(m => ({ kind: "tournament", num: m.number, roundName: names[m.round] || `${m.round + 1}回戦`, red: teamName(m.red), blue: teamName(m.blue) }));

          matches = leagueReady.concat(tournamentReady);
          const skipped = (league.length - leagueReady.length) + (tournament.length - tournamentReady.length);
          setStatus(`リーグ戦${leagueReady.length}試合・トーナメント${tournamentReady.length}試合を読み込みました(${new Date().toLocaleTimeString("ja-JP")})` +
            (skipped ? ` ※対戦相手が決まっていない${skipped}試合は除いています` : ""), false);
          renderList();
          button.disabled = !matches.length;
        } catch (error) {
          console.error("対戦カードの取得エラー:", error);
          setStatus(`取得エラー: ${error.message}`, true);
        }
      }

      async function batchDownload() {
        const button = document.getElementById("batch-download-button");
        const original = button.textContent;
        if (!matches.length) return;
        if (typeof html2canvas !== "function" || typeof JSZip !== "function") {
          alert("画像化・圧縮のライブラリが読み込めていません。通信環境を確認してください。");
          return;
        }
        button.disabled = true;
        try {
          const zip = new JSZip();
          const folder = zip.folder(`${label}_バナー`);
          const folders = { league: folder.folder("リーグ戦"), tournament: folder.folder("トーナメント") };
          for (let i = 0; i < matches.length; i += 1) {
            button.textContent = `作成中… (${i + 1}/${matches.length})`;
            folders[matches[i].kind].file(fileNameOf(matches[i]), await renderBannerBlob(matches[i]));
          }
          button.textContent = "ZIPを作成中…";
          saveBlob(await zip.generateAsync({ type: "blob" }), `${label}_バナー.zip`);
        } catch (error) {
          console.error("まとめてダウンロードのエラー:", error);
          alert(`まとめてダウンロードに失敗しました: ${error.message}`);
        } finally {
          button.disabled = false;
          button.textContent = original;
        }
      }

      document.getElementById("list-area").addEventListener("click", async event => {
        const swap = event.target.closest("[data-swap]");
        if (swap) {
          const m = matches[Number(swap.dataset.swap)];
          swapped[matchKeyOf(m)] = !swapped[matchKeyOf(m)];
          if (!swapped[matchKeyOf(m)]) delete swapped[matchKeyOf(m)];
          try { localStorage.setItem(SWAP_STORAGE_KEY, JSON.stringify(swapped)); } catch (ignore) { /* 保存できなくても動く */ }
          previewIndex = Number(swap.dataset.swap);
          renderList();
          return;
        }
        const one = event.target.closest("[data-one]");
        if (!one) {
          const row = event.target.closest("[data-row]");
          if (row) { previewIndex = Number(row.dataset.row); renderList(); }
          return;
        }
        const match = matches[Number(one.dataset.one)];
        if (!match || typeof html2canvas !== "function") return;
        one.disabled = true;
        try { saveBlob(await renderBannerBlob(match), fileNameOf(match)); }
        catch (error) { console.error(error); alert("画像の保存に失敗しました。"); }
        one.disabled = false;
      });
      const scheduleInput = document.getElementById("schedule-input");
      try { scheduleInput.value = localStorage.getItem(SCHEDULE_STORAGE_KEY) || ""; } catch (ignore) { /* なくても動く */ }
      scheduleInput.addEventListener("input", () => {
        try { localStorage.setItem(SCHEDULE_STORAGE_KEY, scheduleInput.value); } catch (ignore) { /* 保存できなくても動く */ }
        renderPreview();
      });
      window.addEventListener("resize", renderPreview);
      // 全試合の左右を一度に反転する(いま入れ替えてある試合は元に戻る)
      document.getElementById("swap-all-button").addEventListener("click", () => {
        matches.forEach(m => {
          const k = matchKeyOf(m);
          if (swapped[k]) delete swapped[k]; else swapped[k] = true;
        });
        try { localStorage.setItem(SWAP_STORAGE_KEY, JSON.stringify(swapped)); } catch (ignore) { /* 保存できなくても動く */ }
        renderList();
      });
      document.getElementById("reload-button").addEventListener("click", load);
      document.getElementById("batch-download-button").addEventListener("click", batchDownload);
      load();
    }
  </script>
</body>
</html>
