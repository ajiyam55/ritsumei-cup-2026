<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バナー自動生成 - 立命杯2026</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1e24;
      --ink: #242124;
      --muted: #777176;
      --line: #e3dcde;
    }

    html, body {
      min-height: 100%;
      background: #fff;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      padding: 64px clamp(12px, 3vw, 28px) 40px;
    }

    .page {
      width: min(820px, 100%);
      margin: 0 auto;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 24px;
      z-index: 10;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgb(65 25 28 / 18%);
    }

    .back-button:hover {
      background-color: #a54c52;
    }

    @media (max-width: 520px) {
      .back-button {
        left: 14px;
      }
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 6px;
    }

    .notice {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .notice strong {
      color: var(--ink);
    }

    .switch-court-link {
      display: inline-block;
      margin-top: 4px;
      color: var(--primary);
      font-weight: bold;
      text-decoration: underline;
    }

    .status-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 16px;
      margin: 14px 0 22px;
      padding: 10px 14px;
      background: #f7f4f5;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .status-line .dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4caf50;
    }

    .status-line.is-paused .dot {
      background: var(--muted);
    }

    .status-line .buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .pill-button {
      padding: 6px 14px;
      color: var(--primary);
      background: #fff;
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .pill-button:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    /* コート選択画面(?court= なしで開いたとき) */
    .chooser {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .chooser a {
      display: block;
      padding: 18px;
      text-align: center;
      color: var(--primary);
      background: #f7f4f5;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
    }

    .court-block {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .court-block-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .court-block-head h2 {
      font-size: 1.3rem;
    }

    .save-now {
      margin-left: auto;
      padding: 6px 14px;
      color: var(--primary);
      background: #fff;
      border: 1.5px solid var(--primary);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    .save-now:disabled {
      opacity: 0.5;
      cursor: progress;
    }

    /* 実際に画像として書き出す「バナー」本体(画面下三分の一のテロップ想定) */
    .banner {
      width: 100%;
      aspect-ratio: 1280 / 220;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.5vw, 30px);
      padding: 0 clamp(16px, 3vw, 44px);
      background: linear-gradient(90deg, rgba(36,33,36,0.94), rgba(36,33,36,0.8));
      border-radius: 6px;
      color: #fff;
      font-size: clamp(1rem, 3.2vw, 1.8rem);
      font-weight: bold;
      overflow: hidden;
    }

    .banner .court-tag {
      flex: 0 0 auto;
      padding: 0.3em 0.7em;
      background: var(--primary);
      border-radius: 4px;
      font-size: 0.7em;
      white-space: nowrap;
    }

    .banner .round-tag {
      flex: 0 0 auto;
      color: #e7dfe0;
      font-size: 0.55em;
      white-space: nowrap;
    }

    .banner .team {
      flex: 1 1 auto;
      min-width: 0;
      text-align: center;
      overflow: hidden;
      white-space: normal;
      word-break: break-word;
      line-height: 1.15;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .banner .team.red { color: #ff8a7a; }
    .banner .team.blue { color: #86b6ff; }

    .banner .vs {
      flex: 0 0 auto;
      color: #c8c1c3;
      font-size: 0.55em;
    }

    .banner.is-empty {
      color: #a8a2a6;
      font-size: 1rem;
      font-weight: normal;
    }

    .log-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin: 16px 0 6px;
    }

    .log-head h3 {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .log-head .buttons {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .log-table th, .log-table td {
      padding: 4px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .log-table th {
      color: var(--muted);
      font-weight: normal;
    }

    .log-empty {
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 640px) {
      .banner {
        aspect-ratio: 640 / 180;
      }
    }
  </style>
</head>
<body>
  <a id="back-button" class="back-button" href="index.html" target="_top">← 戻る</a>
  <main class="page" id="page"></main>

  <script>
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbza6AIm125gIvvvr0OEUQdy0eqdDmj3rHG2u8MFfqwLMyuHmJCUAWTuXQMUmpRAMX28sw/exec";
    // Code.gs 側の BANNER_TOKEN と同じ値にしてください(スコアを書き換えられる管理者パスワードとは別物)。
    const BANNER_TOKEN = "banner-log-2026";
    const COURTS = {
      A: { label: "Aコート" },
      B: { label: "Bコート" },
      C: { label: "Cコート" }
    };
    const POLL_MS = 5000;

    const courtKey = new URLSearchParams(window.location.search).get("court");

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    // コート指定が無ければ、リングごとに開くための選択画面だけを出す
    if (!courtKey || !COURTS[courtKey]) {
      document.getElementById("page").innerHTML = `
        <h1>バナー自動生成</h1>
        <p class="notice">リングごとに別のパソコン・別のタブで開けるように、コートごとのページに分けています。該当するコートを選んでください。</p>
        <div class="chooser">
          ${Object.entries(COURTS).map(([key, court]) => `<a href="banner.html?court=${key}">${court.label}用を開く</a>`).join("")}
        </div>
      `;
    } else {
      runCourtPage(courtKey);
    }

    function runCourtPage(key) {
      const label = COURTS[key].label;
      document.title = `${label} バナー自動生成 - 立命杯2026`;
      document.getElementById("page").innerHTML = `
        <h1>${label} バナー自動生成</h1>
        <p class="notice">
          ${label}の試合が切り替わるたびに、その時刻(経過分つき)をスプレッドシートに記録します。
          画像はその場ではダウンロードしません。<strong>すべての試合が終わったあと、下の「まとめてダウンロード」を押すと、
          記録した試合ぶんのバナー画像をまとめて書き出せます。</strong>
          <strong>このタブを開いたまま、パソコンをスリープさせずに置いておいてください。</strong>
          その場で画像が必要なときは「今すぐ保存」でいつでも1枚だけ書き出せます。
          <br><a class="switch-court-link" href="banner.html">他のコートを選び直す</a>
        </p>
        <div class="status-line" id="status-line">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">読み込み中…</span>
          <div class="buttons">
            <button class="pill-button" id="toggle-button" type="button">一時停止</button>
          </div>
        </div>
        <section class="court-block">
          <div class="court-block-head">
            <h2>${label}</h2>
            <button class="save-now" type="button">今すぐ保存</button>
          </div>
          <div class="banner-holder" id="banner-holder"></div>
        </section>
        <div class="log-head">
          <h3>この試合は何時何分から(新しい順)</h3>
          <div class="buttons">
            <button class="pill-button" id="batch-download-button" type="button">まとめてダウンロード</button>
            <button class="pill-button" id="export-log-button" type="button">一覧をダウンロード(CSV)</button>
          </div>
        </div>
        <div id="log-area"></div>
      `;

      let running = true;
      let lastMatchKey = "";
      let firstLoadDone = false;
      // 「何時何分から、どの試合だったか」を全部ここに溜めておく(書き出し用)
      const history = [];

      function teamName(team) {
        if (!team || !team.name || team.name === "未設定") return "未設定";
        return team.name;
      }

      function matchKeyOf(data) {
        if (!data || data.error || !data.currentNum) return "";
        const current = data.matches.find(m => String(m.num) === String(data.currentNum));
        if (!current) return "";
        return `${data.currentNum}:${teamName(current.red)}:${teamName(current.blue)}`;
      }

      function bannerMarkup(data) {
        if (data.error || !data.currentNum) {
          return `<div class="banner is-empty">現在の試合はまだありません</div>`;
        }
        const current = data.matches.find(m => String(m.num) === String(data.currentNum));
        if (!current) return `<div class="banner is-empty">現在の試合はまだありません</div>`;
        const blockIndex = Math.ceil(Number(data.currentNum) / 3);

        return `<div class="banner">
          <span class="court-tag">${escapeHtml(label)}</span>
          <span class="round-tag">第${escapeHtml(blockIndex)}ブロック<br>第${escapeHtml(data.currentNum)}試合</span>
          <span class="team red">${escapeHtml(teamName(current.red))}</span>
          <span class="vs">VS</span>
          <span class="team blue">${escapeHtml(teamName(current.blue))}</span>
        </div>`;
      }

      // 名前が長くて枠からはみ出す/省略されるのを防ぐため、2行に収まるまでフォントサイズを自動で縮める
      function fitBannerNames(bannerEl) {
        if (!bannerEl) return;
        bannerEl.querySelectorAll(".team").forEach(el => {
          const lineHeightRatio = 1.15;
          el.style.fontSize = "";
          let fontSize = parseFloat(getComputedStyle(el).fontSize);
          const minFontSize = Math.max(10, fontSize * 0.4);
          for (let i = 0; i < 40; i++) {
            const maxHeight = fontSize * lineHeightRatio * 2 + 1;
            if (el.scrollHeight <= maxHeight || fontSize <= minFontSize) break;
            fontSize -= 1;
            el.style.fontSize = fontSize + "px";
          }
        });
      }

      function pad(n) { return String(n).padStart(2, "0"); }

      function timestampForFilename(date) {
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}-${pad(date.getMinutes())}-${pad(date.getSeconds())}`;
      }

      function renderLog() {
        const area = document.getElementById("log-area");
        if (!history.length) {
          area.innerHTML = `<p class="log-empty">まだ記録がありません。</p>`;
          return;
        }
        const rows = history.slice().reverse().map(entry => `<tr>
          <td>${escapeHtml(entry.time)}</td>
          <td>${entry.elapsedMinutes === "" || entry.elapsedMinutes === undefined ? "—" : escapeHtml(entry.elapsedMinutes) + "分"}</td>
          <td>第${escapeHtml(entry.block || "?")}ブロック</td>
          <td>第${escapeHtml(entry.matchNum)}試合</td>
          <td>${escapeHtml(entry.red)} VS ${escapeHtml(entry.blue)}</td>
        </tr>`).join("");
        area.innerHTML = `<table class="log-table">
          <thead><tr><th>開始時刻</th><th>経過</th><th>ブロック</th><th>試合</th><th>対戦</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      }

      function exportLog() {
        if (!history.length) return;
        const lines = ["開始時刻,経過(分),ブロック,試合,赤,青"]
          .concat(history.map(e => [
            e.time, e.elapsedMinutes, `第${e.block || "?"}ブロック`, `第${e.matchNum}試合`, e.red, e.blue
          ].join(",")));
        const blob = new Blob([lines.join("\n")], { type: "text/csv" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `banner_log_${label}_${timestampForFilename(new Date())}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      // サーバー(スプレッドシート)に積んである記録を読み直す。
      // ページを開き直しても、それまでの記録が消えないようにするため。
      async function loadPersistedLog() {
        try {
          const url = new URL(API_BASE_URL);
          url.searchParams.set("mode", "matchlog");
          url.searchParams.set("court", key);
          url.searchParams.set("t", Date.now());
          const response = await fetch(url.toString(), { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = JSON.parse(await response.text());
          if (data.error) throw new Error(data.error);

          history.length = 0;
          (data.rows || []).forEach(row => {
            history.push({
              time: row.time,
              block: row.block,
              matchNum: row.matchNum,
              red: row.redName,
              blue: row.blueName,
              elapsedMinutes: row.elapsedMinutes
            });
          });
          renderLog();
        } catch (error) {
          console.error("記録の取得エラー:", error);
        }
      }

      // 試合が切り替わったタイミングを、スプレッドシートへ1行追記する(画像はまだ作らない)。
      async function logMatchChange(matchNum, blockIndex, current) {
        try {
          const response = await fetch(API_BASE_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "logMatch",
              token: BANNER_TOKEN,
              court: key,
              block: blockIndex,
              matchNum,
              redNumber: (current.red && current.red.num) || "",
              redName: teamName(current.red),
              blueNumber: (current.blue && current.blue.num) || "",
              blueName: teamName(current.blue)
            })
          });
          const data = JSON.parse(await response.text());
          if (data.error) throw new Error(data.error);

          if (!data.skipped) {
            history.push({
              time: new Date().toLocaleTimeString("ja-JP"),
              block: blockIndex,
              matchNum,
              red: teamName(current.red),
              blue: teamName(current.blue),
              elapsedMinutes: data.elapsedMinutes
            });
            renderLog();
          }
        } catch (error) {
          console.error("試合記録の保存エラー:", error);
        }
      }

      // 今表示しているバナーを、その場で1枚だけPNGとして書き出す(手動)。
      async function captureCurrentBanner() {
        const bannerEl = document.querySelector("#banner-holder .banner");
        if (!bannerEl || bannerEl.classList.contains("is-empty")) return;
        if (typeof html2canvas !== "function") {
          alert("画像化ライブラリが読み込めていません。通信環境を確認してください。");
          return;
        }
        try {
          const canvas = await html2canvas(bannerEl, { backgroundColor: null, scale: 2 });
          const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
          if (!blob) throw new Error("画像の作成に失敗しました");

          const filename = `banner_${label}_now_${timestampForFilename(new Date())}.png`;
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        } catch (error) {
          console.error("バナー画像の保存エラー:", error);
          alert("画像の保存に失敗しました。");
        }
      }

      // 記録1件ぶんのバナーを画面外で組み立てて、画像として書き出す(まとめてダウンロード用)。
      async function downloadHistoricalBanner(entry, index) {
        const holder = document.createElement("div");
        holder.style.position = "fixed";
        holder.style.left = "-9999px";
        holder.style.top = "0";
        holder.style.width = "1280px";
        holder.innerHTML = `<div class="banner">
          <span class="court-tag">${escapeHtml(label)}</span>
          <span class="round-tag">第${escapeHtml(entry.block || "?")}ブロック<br>第${escapeHtml(entry.matchNum || "?")}試合</span>
          <span class="team red">${escapeHtml(entry.red)}</span>
          <span class="vs">VS</span>
          <span class="team blue">${escapeHtml(entry.blue)}</span>
        </div>`;
        document.body.appendChild(holder);

        try {
          const bannerEl = holder.querySelector(".banner");
          fitBannerNames(bannerEl);
          const canvas = await html2canvas(bannerEl, { backgroundColor: null, scale: 2 });
          const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
          if (!blob) throw new Error("画像の作成に失敗しました");

          const safeTime = String(entry.time || "").replace(/[:\s]/g, "-");
          const filename = `banner_${label}_${String(index + 1).padStart(3, "0")}_${safeTime}.png`;
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        } finally {
          holder.remove();
        }
      }

      // 記録してある試合ぶんを、古い順にまとめて画像化してダウンロードする。
      async function batchDownload() {
        const button = document.getElementById("batch-download-button");
        const original = button.textContent;
        button.disabled = true;

        try {
          await loadPersistedLog();
          if (!history.length) {
            alert("まだ記録がありません。");
            return;
          }
          if (typeof html2canvas !== "function") {
            alert("画像化ライブラリが読み込めていません。通信環境を確認してください。");
            return;
          }

          for (let i = 0; i < history.length; i += 1) {
            button.textContent = `書き出し中… (${i + 1}/${history.length})`;
            await downloadHistoricalBanner(history[i], i);
            // ブラウザが連続ダウンロードをブロックしないよう、少し間を空ける
            await new Promise(resolve => setTimeout(resolve, 400));
          }
        } catch (error) {
          console.error("まとめてダウンロードのエラー:", error);
          alert(`まとめてダウンロードに失敗しました: ${error.message}`);
        } finally {
          button.disabled = false;
          button.textContent = original;
        }
      }

      function setStatus(text, paused) {
        document.getElementById("status-text").textContent = text;
        document.getElementById("status-line").classList.toggle("is-paused", Boolean(paused));
      }

      async function poll() {
        if (!running) return;

        try {
          const url = new URL(API_BASE_URL);
          url.searchParams.set("t", Date.now());
          const response = await fetch(url.toString(), { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = JSON.parse(await response.text());
          if (data.error) throw new Error(data.error);

          const courtData = (data.courts || {})[key] || { error: "データがありません" };
          const holderEl = document.getElementById("banner-holder");
          holderEl.innerHTML = bannerMarkup(courtData);
          fitBannerNames(holderEl.querySelector(".banner"));

          const matchKey = matchKeyOf(courtData);
          if (firstLoadDone && matchKey && matchKey !== lastMatchKey) {
            const current = courtData.matches.find(m => String(m.num) === String(courtData.currentNum));
            const blockIndex = Math.ceil(Number(courtData.currentNum) / 3);
            await logMatchChange(courtData.currentNum, blockIndex, current);
          }
          if (matchKey) lastMatchKey = matchKey;
          firstLoadDone = true;
          setStatus(`記録中(最終確認: ${new Date().toLocaleTimeString("ja-JP")})`, false);
        } catch (error) {
          console.error("バナー自動生成の取得エラー:", error);
          setStatus(`取得エラー: ${error.message}`, false);
        }
      }

      function updateVisibilityWarning() {
        if (document.hidden) {
          setStatus("裏のタブになっています。更新が遅れることがあります(開き直すとすぐ追いつきます)", true);
        } else {
          setStatus(running ? "記録中…" : "一時停止中(試合が変わっても記録されません)", !running);
          poll();
        }
      }

      renderLog();
      loadPersistedLog().then(poll);
      setInterval(poll, POLL_MS);
      document.addEventListener("visibilitychange", updateVisibilityWarning);

      document.getElementById("toggle-button").addEventListener("click", event => {
        running = !running;
        event.target.textContent = running ? "一時停止" : "再開";
        setStatus(running ? "記録中…" : "一時停止中(試合が変わっても記録されません)", !running);
      });

      document.querySelector(".save-now").addEventListener("click", async () => {
        const button = document.querySelector(".save-now");
        button.disabled = true;
        await captureCurrentBanner();
        button.disabled = false;
      });

      document.getElementById("export-log-button").addEventListener("click", exportLog);
      document.getElementById("batch-download-button").addEventListener("click", batchDownload);
    }
  </script>
</body>
