<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トーナメント表 - 立命杯2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1e24;
      --primary-light: #a54c52;
      --ink: #242124;
      --muted: #777176;
      --line: #d4cdd0;
      --winner: #c58a18;
      --surface: #fff;
    }

    html, body {
      min-height: 100%;
      background: #f4f0ee;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      padding: 72px 24px 32px;
    }

    .page {
      width: min(1480px, 100%);
      margin: 0 auto;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 24px;
      z-index: 10;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgb(65 25 28 / 18%);
      transition: background-color 0.2s, transform 0.2s;
    }

    .back-button:hover {
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      display: inline-block;
      width: 24px;
      height: 3px;
      background: var(--line);
    }

    .legend .is-winner i {
      background: var(--winner);
    }

    .bracket-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(300px, 1fr));
      gap: 12px;
      overflow-x: auto;
    }

    .final-section {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--winner);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .final-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .final-heading h2 {
      font-size: 1.3rem;
    }

    .final-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .final-matches {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 8px;
    }

    .final-matches .match::after {
      display: none;
    }

    .block {
      min-width: 0;
      padding: 12px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .block-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .block-heading h2 {
      font-size: 1.1rem;
    }

    .block-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .rounds {
      display: grid;
      grid-template-columns: repeat(4, minmax(104px, 1fr));
      gap: 7px;
      min-height: 540px;
    }

    .round {
      min-width: 0;
      position: relative;
    }

    .round-label {
      display: block;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: bold;
      text-align: center;
    }

    .round-grid {
      display: grid;
      grid-template-rows: repeat(16, 1fr);
      height: calc(100% - 22px);
      margin-top: 8px;
    }

    .match {
      position: relative;
      align-self: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      overflow: visible;
    }

    .match::after {
      display: none;
    }

    .team {
      position: relative;
    }

    .round:not(:last-child) .team::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -8px;
      width: 7px;
      height: 1px;
      background: var(--line);
    }

    .round:not(:last-child) .team.is-winner::after {
      background: var(--winner);
    }

    .match.is-winner {
      border-color: var(--winner);
      box-shadow: 0 0 0 2px rgb(197 138 24 / 18%);
    }

    .match-number {
      display: block;
      padding: 3px 5px;
      color: var(--muted);
      background: #f7f4f3;
      border-bottom: 1px solid var(--line);
      font-size: 0.6rem;
    }

    .match-number span {
      float: right;
      color: var(--muted);
      font-weight: normal;
    }

    .team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 27px;
      gap: 4px;
      padding: 4px 5px;
      font-size: 0.64rem;
    }

    .team + .team {
      border-top: 1px solid #eee9e9;
    }

    .team-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-score {
      flex: 0 0 auto;
      color: var(--muted);
      font-weight: bold;
    }

    .team.is-winner {
      color: #875d06;
      font-weight: bold;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      color: var(--muted);
      background: #faf7f6;
      border-left: 3px solid var(--winner);
      font-size: 0.82rem;
    }

    .status.is-error {
      color: #8d2525;
      background: #fff1f1;
      border-left-color: #c44b4b;
    }

    @media (max-width: 900px) {
      body {
        padding: 72px 14px 24px;
      }

      .page-header {
        align-items: start;
        flex-direction: column;
      }

      .bracket-board {
        grid-template-columns: 1fr;
        overflow-x: visible;
      }

      .final-matches {
        grid-template-columns: 1fr;
      }

      .block {
        min-width: 0;
      }
    }

    @media (max-width: 520px) {
      .back-button {
        left: 14px;
      }

      .legend {
        flex-wrap: wrap;
        white-space: normal;
      }

      .rounds {
        grid-template-columns: repeat(4, minmax(82px, 1fr));
        gap: 8px;
        min-height: 500px;
      }

      .block {
        padding: 12px 8px;
      }

      .final-section {
        padding: 12px 8px;
      }

      .team {
        padding: 5px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-button">← 戻る</a>
  <main class="page">
    <header class="page-header">
      <div>
        <h1>決勝トーナメント</h1>
        <p>各ブロックの予選勝者による決勝トーナメント</p>
      </div>
      <div class="legend" aria-label="表示の凡例">
        <span><i></i>未確定</span>
        <span class="is-winner"><i></i>勝ち上がり</span>
      </div>
    </header>

    <section id="final-section" class="final-section" aria-labelledby="final-heading"></section>
    <section id="bracket-board" class="bracket-board" aria-label="各ブロック決勝トーナメント"></section>
    <p id="api-status" class="status">トーナメントデータを読み込み中です。</p>
  </main>

  <script>
    const BLOCKS = ["A", "B", "C"];
    const ROUND_NAMES = ["1回戦", "2回戦", "準々決勝", "準決勝"];
    const SLOT_COUNT = 16;
    const ROUND_OFFSETS = [0, 8, 12, 14];
    const TOURNAMENT_API_URLS = {
      A: "https://script.google.com/macros/s/AKfycbzKNWG9J2TMjidRCFLLG__8z3ddePmlw4dhfpQLANkKYFGt7fHzCii1Dri2ZdUDA3xP3Q/exec",
      B: "",
      C: ""
    };

    // 後でApps ScriptのJSONをここへ渡せるデータ形式にしておく。
    const tournamentData = {
      A: { matches: [] },
      B: { matches: [] },
      C: { matches: [] },
      finalMatches: []
    };

    function getMatch(block, round, matchIndex) {
      return tournamentData[block].matches.find(
        match => match.round === round && match.match === matchIndex
      ) || {};
    }

    function teamMarkup(team) {
      const name = team && team.name ? team.name : "出場者未定";
      const number = team && team.number ? `${team.number}番 ` : "";
      const score = team && team.score !== undefined && team.score !== "" ? team.score : "-";
      const winner = team && team.winner ? " is-winner" : "";

      return `<div class="team${winner}">
        <span class="team-name">${number}${name}</span>
        <span class="team-score">${score}</span>
      </div>`;
    }

    function matchMarkup(block, round, matchIndex) {
      const match = getMatch(block, round, matchIndex);
      const winnerClass = match.winner ? " is-winner" : "";
      const rowStart = (matchIndex - 1) * (2 ** (round + 1)) + 1;
      const rowSpan = 2 ** (round + 1);
      const totalMatchNumber = ROUND_OFFSETS[round] + matchIndex;

      return `<article class="match${winnerClass}" style="grid-row: ${rowStart} / span ${rowSpan};">
        <span class="match-number">第${totalMatchNumber}試合<span>スコア</span></span>
        ${teamMarkup(match.red)}
        ${teamMarkup(match.blue)}
      </article>`;
    }

    function blockMarkup(block) {
      return `<section class="block" aria-labelledby="block-${block}">
        <div class="block-heading">
          <h2 id="block-${block}">${block}ブロック</h2>
          <span>最大16枠</span>
        </div>
        <div class="rounds">
          ${ROUND_NAMES.map((name, round) => `
            <div class="round">
              <span class="round-label">${name}</span>
              <div class="round-grid">
                ${Array.from({ length: SLOT_COUNT / (2 ** (round + 1)) }, (_, index) =>
                  matchMarkup(block, round, index + 1)
                ).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </section>`;
    }

    function finalMarkup() {
      const matches = tournamentData.finalMatches || [];
      const isReady = matches.length === 3 && matches.every(match =>
        match.red && match.red.name && match.blue && match.blue.name
      );

      return `<div class="final-heading">
        <h2 id="final-heading">最終決戦</h2>
        <span>${isReady ? "A・B・Cブロック代表の総当たり" : "3ブロックの代表決定後に組み合わせを表示"}</span>
      </div>
      ${isReady ? `<div class="final-matches">
        ${[0, 1, 2].map((index) => {
          const match = matches[index] || {};
          return `<article class="match${match.winner ? " is-winner" : ""}">
            <span class="match-number">最終第${index + 1}試合<span>スコア</span></span>
            ${teamMarkup(match.red)}
            ${teamMarkup(match.blue)}
          </article>`;
        }).join("")}
      </div>` : `<p class="final-pending">A・B・Cの代表が全員決まると、ここに最終3試合を表示します。</p>`}`;
    }

    function renderTournament(data = tournamentData) {
      Object.assign(tournamentData, data);
      document.getElementById("final-section").innerHTML = finalMarkup();
      document.getElementById("bracket-board").innerHTML = BLOCKS
        .map(blockMarkup)
        .join("");
    }

    renderTournament();

    function firstQualifier(data) {
      if (data && Array.isArray(data.blocks)) {
        return data.blocks.find(block => block.winnerConfirmed && block.winner?.name)?.winner || null;
      }

      if (data && Array.isArray(data.qualifiers) && data.qualifiers[0]) {
        return data.qualifiers[0];
      }

      return null;
    }

    function blockPayload(data, block) {
      if (data && Array.isArray(data.matches) && data.matches.length) {
        return { matches: data.matches };
      }

      const sourceBlock = data && data[block];
      if (sourceBlock && Array.isArray(sourceBlock.matches)) {
        return sourceBlock;
      }

      const firstBlock = data && Array.isArray(data.blocks) ? data.blocks[0] : null;
      return firstBlock && Array.isArray(firstBlock.matches)
        ? { matches: firstBlock.matches }
        : { matches: [] };
    }

    function finalMatchesFromQualifiers() {
      const qualifiers = BLOCKS.map(block => tournamentData[block].qualifier);
      if (qualifiers.some(qualifier => !qualifier || !qualifier.name)) {
        return [];
      }

      return [
        [qualifiers[0], qualifiers[1]],
        [qualifiers[1], qualifiers[2]],
        [qualifiers[2], qualifiers[0]]
      ].map((teams, index) => ({
        round: null,
        match: index + 1,
        red: teams[0],
        blue: teams[1],
        winner: false
      }));
    }

    async function loadTournamentData() {
      const status = document.getElementById("api-status");

      try {
        const results = await Promise.all(BLOCKS.map(async block => {
          const url = TOURNAMENT_API_URLS[block];
          if (!url) return { block, data: null };

          const response = await fetch(`${url}?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`${block}: HTTP ${response.status}`);

          const data = await response.json();
          if (data.error) throw new Error(`${block}: ${data.error}`);
          return { block, data };
        }));

        results.forEach(({ block, data }) => {
          if (!data) return;
          tournamentData[block] = {
            ...blockPayload(data, block),
            qualifier: firstQualifier(data)
          };
        });

        tournamentData.finalMatches = finalMatchesFromQualifiers();
        renderTournament(tournamentData);
        const connected = results.filter(result => result.data).length;
        const qualified = BLOCKS.filter(block => tournamentData[block].qualifier?.name).length;
        status.textContent = qualified === 3
          ? "A・B・Cの代表が確定し、最終戦を表示しています。"
          : `${connected}/3ブロックを取得中。代表確定: ${qualified}/3。`;
        status.classList.remove("is-error");
      } catch (error) {
        console.error("Tournament API error:", error);
        status.textContent = `データ取得エラー: ${error.message}`;
        status.classList.add("is-error");
      }
    }

    loadTournamentData();
    setInterval(loadTournamentData, 10000);
  </script>
</body>
</html>
