<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トーナメント表 - 立命杯2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1e24;
      --primary-light: #a54c52;
      --ink: #242124;
      --muted: #777176;
      --line: #d4cdd0;
      --winner: #c58a18;
      --surface: #fff;
    }

    html, body {
      min-height: 100%;
      background: #f4f0ee;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      padding: 72px 24px 32px;
    }

    .page {
      width: min(1480px, 100%);
      margin: 0 auto;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 24px;
      z-index: 10;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgb(65 25 28 / 18%);
      transition: background-color 0.2s, transform 0.2s;
    }

    .back-button:hover {
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      display: inline-block;
      width: 24px;
      height: 3px;
      background: var(--line);
    }

    .legend .is-winner i {
      background: var(--winner);
    }

    /* 管理者の注意書きは、ヘッダーの下の段に横いっぱいで出す */
    .page-header {
      flex-wrap: wrap;
    }

    .page-header > .refresh-button {
      white-space: nowrap;
    }

    .admin-controls {
      flex: 1 1 100%;
      order: 10;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .admin-controls[hidden] {
      display: none !important;
    }

    .admin-controls label {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .admin-controls input {
      width: 150px;
      min-height: 30px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .admin-controls button {
      min-height: 30px;
      padding: 4px 10px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .status.is-error {
      color: #b3261e;
    }

    .final-pending {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .bracket-board {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      overflow-x: visible;
    }

    .final-section {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--winner);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .final-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .final-heading h2 {
      font-size: 1.3rem;
    }

    .final-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .final-matches {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }

    .final-matches .match {
      width: 100%;
    }

    .final-matches .match::before,
    .final-matches .match::after {
      display: none;
    }

    .block {
      min-width: 0;
      padding: 10px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .block-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .block-heading h2 {
      font-size: 1.1rem;
    }

    .block-heading {
      align-items: center;
      gap: 8px;
    }

    .block-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .updated {
      color: var(--muted);
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .refresh-button {
      min-height: 30px;
      padding: 4px 14px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .refresh-button:hover:not(:disabled) {
      background: var(--primary-light);
    }

    .refresh-button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    .save-button {
      min-height: 30px;
      padding: 4px 14px;
      color: var(--primary);
      background: #fff;
      border: 2px solid var(--primary);
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 未保存の変更があるとき */
    .save-button.is-dirty {
      color: #fff;
      background: var(--winner);
      border-color: var(--winner);
    }

    .save-button:disabled {
      opacity: 0.6;
      cursor: progress;
    }

    /* 見出しの下に、薄い灰色の小さな文字で出す */
    .dirty-note {
      margin: -4px 0 8px;
      color: #a8a2a6;
      font-size: 0.72rem;
      text-align: right;
    }

    .dirty-note:empty {
      display: none;
    }

    .score-input:disabled {
      background: #f3f0f1;
    }

    .block-note {
      margin: -4px 0 8px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .block-note.is-error,
    .status.is-error {
      color: #b3261e;
    }

    .status {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .admin-controls > span {
      flex: 1 1 220px;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.5;
    }

    .admin-controls button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    /* 管理者ログイン: 入力するまで画面全体を隠す */
    .login {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f0ee;
    }

    .login[hidden] {
      display: none;
    }

    .login-box {
      display: grid;
      gap: 14px;
      width: min(340px, 100%);
      padding: 24px;
      background: #fff;
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .login-box label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .login-box input {
      min-height: 40px;
      padding: 6px 10px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 1rem;
    }

    .login-box button {
      min-height: 40px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-error {
      min-height: 1.2em;
      color: #b3261e;
      font-size: 0.8rem;
    }

    .login-back {
      justify-self: center;
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
    }

    .login-back:hover {
      text-decoration: underline;
    }

    /* ---- トーナメント本体 ---- */

    .rounds {
      --link: 28px;   /* 回戦と回戦の間(線を引く幅) */
      --row-h: 44px;  /* 1枠あたりの高さ */
      display: grid;
      grid-template-columns: repeat(var(--round-count), minmax(0, 1fr));
      column-gap: var(--link);
    }

    .round {
      min-width: 0;
    }

    .round-label {
      display: block;
      height: 14px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: bold;
      text-align: center;
    }

    .round-grid {
      display: grid;
      grid-template-rows: repeat(var(--slot-count), var(--row-h));
      margin-top: 8px;
    }

    /* 1試合ぶんの場所。線はここに描く */
    .slot {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .match {
      --head-h: 0px; /* 「第N試合」の見出しの高さぶん(線の位置合わせ用) */
      position: relative;
      width: 100%;
      border: 2px solid #222;
      background: #fff;
    }

    .match.has-number {
      --head-h: 18px;
    }

    /* 見出しぶん上にずらして、線が2選手の境目から出るようにする */
    .rounds .match {
      margin-top: calc(var(--head-h) * -1);
    }

    /* 右へ伸びる横線(勝ち上がり) */
    .round:not(:last-child) .slot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 100%;
      width: calc(var(--link) / 2);
      height: 3px;
      margin-top: -1.5px;
      background: var(--line);
    }

    /* 2試合をつなぐ縦線。上の試合は下へ、下の試合は上へ */
    .round:not(:last-child) .slot::before {
      content: "";
      position: absolute;
      left: calc(100% + var(--link) / 2 - 1.5px);
      width: 3px;
      background: var(--line);
    }

    .slot.is-upper::before {
      top: 50%;
      height: 50%;
    }

    .slot.is-lower::before {
      top: 0;
      height: 50%;
    }

    /* 次の試合の左側に入る横線 */
    .round:not(:first-child) .match::before {
      content: "";
      position: absolute;
      top: calc(50% + var(--head-h) / 2);
      left: calc(var(--link) / -2 - 2px);
      width: calc(var(--link) / 2);
      height: 3px;
      margin-top: -1.5px;
      background: var(--line);
    }

    /* 勝ち上がった線は金色 */
    /* 上の通常ルールより詳しく書かないと色が負けてしまう */
    .round:not(:last-child) .slot.is-advanced::before,
    .round:not(:last-child) .slot.is-advanced::after,
    .round:not(:first-child) .match.is-fed::before {
      background: var(--winner);
    }

    .match.is-bye {
      border: 0;
      background: transparent;
    }

    .match.is-bye .team {
      border: 2px solid #222;
      border-radius: 12px;
      background: #fff;
    }

    /* シード(不戦勝)の選手も黄色で囲む */
    .match.is-bye .team.is-winner {
      border-color: var(--winner);
      background: #fff8e6;
      outline: none;
    }

    .match-number {
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-sizing: border-box;
      height: 18px;
      padding: 0 4px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.6rem;
    }

    .match-number span {
      color: var(--muted);
      font-weight: normal;
    }

    .team {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      gap: 4px;
      padding: 3px 4px;
      font-size: 0.64rem;
    }

    .team + .team {
      border-top: 1px solid #eee9e9;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-score {
      flex: 0 0 auto;
      min-width: 22px;
      color: var(--muted);
      text-align: right;
      font-weight: bold;
    }

    .score-input {
      width: 30px;
      min-height: 22px;
      padding: 1px 2px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 3px;
      text-align: center;
    }

    /* 勝った側の選手だけを黄色で囲む */
    .team.is-winner {
      color: #875d06;
      font-weight: bold;
      background: #fff8e6;
      outline: 3px solid var(--winner);
      outline-offset: -3px;
    }

    /* まだ相手が決まっていない枠 */
    .team.is-empty {
      color: #b5aeb2;
    }

    /* 長い名前をタップ(PCはカーソルを載せる)したときに全文を出す */
    .name-tip {
      position: fixed;
      z-index: 200;
      max-width: min(320px, 90vw);
      padding: 6px 10px;
      color: #fff;
      background: #242124;
      border-radius: 6px;
      box-shadow: 0 4px 12px rgb(0 0 0 / 25%);
      font-size: 0.8rem;
      line-height: 1.4;
      word-break: break-all;
      pointer-events: none;
    }

    .name-tip[hidden] {
      display: none;
    }

    /* 表彰 */
    .podium-section {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--winner);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .podium-section[hidden] {
      display: none;
    }

    .podium-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .podium-heading h2 {
      font-size: 1.3rem;
    }

    .podium-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      list-style: none;
    }

    .podium-item {
      position: relative;
      display: grid;
      gap: 6px;
      overflow: hidden;
      padding: 12px;
      border: 2px solid var(--medal-edge);
      border-radius: 10px;
      background: var(--medal-face);
      color: var(--medal-ink);
    }

    .podium-item.rank-1 {
      --medal-face: linear-gradient(145deg, #fff6c2 0%, #f8d64e 28%, #e0a814 55%, #fbe27a 78%, #d99a0b 100%);
      --medal-edge: #b07d00;
      --medal-ink: #4a3000;
    }

    .podium-item.rank-2 {
      --medal-face: linear-gradient(145deg, #ffffff 0%, #dfe4ea 30%, #b4bcc6 58%, #eef1f4 80%, #a3acb7 100%);
      --medal-edge: #8b95a1;
      --medal-ink: #2b3138;
    }

    .podium-item.rank-3 {
      --medal-face: linear-gradient(145deg, #fbdcbc 0%, #e0a672 30%, #c47a3a 58%, #eab98a 80%, #a9642a 100%);
      --medal-edge: #8f5320;
      --medal-ink: #3b1f0a;
    }

    .podium-rank {
      font-size: 0.8rem;
      font-weight: bold;
    }

    .podium-name {
      font-size: 1.05rem;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .podium-item.rank-1 .podium-name {
      font-size: 1.25rem;
    }

    /* 1位だけ、表示されたときに一度だけ光が横切る */
    @media (prefers-reduced-motion: no-preference) {
      .podium-item.rank-1::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 35%, rgb(255 255 255 / 75%) 50%, transparent 65%);
        transform: translateX(-120%);
        animation: podium-shine 1.4s ease-out 0.4s 1 forwards;
        pointer-events: none;
      }
    }

    @keyframes podium-shine {
      to { transform: translateX(120%); }
    }

    /* 三すくみのときの手動設定 */
    .tie-box {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 10px;
      background: #faf7f6;
      border: 1px dashed var(--line);
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .tie-state {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .tie-state.is-error {
      color: #b3261e;
    }

    .tie-selects {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .tie-selects label {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .tie-selects select {
      min-height: 32px;
      padding: 4px 6px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
    }

    @media (max-width: 900px) {
      .podium {
        grid-template-columns: 1fr;
      }

      body {
        padding: 72px 14px 24px;
      }

      .page-header {
        align-items: start;
        flex-direction: column;
      }

      .bracket-board {
        grid-template-columns: 1fr;
      }

      .final-matches {
        grid-template-columns: 1fr;
      }

      /* 狭い画面では横にスクロールして読めるようにする。
         見出し(更新・保存ボタン)はスクロールの外に置き、常に右上に見えるようにする */
      .rounds-scroll {
        overflow-x: auto;
      }

      .rounds {
        --link: 20px;
        min-width: calc(var(--round-count) * 128px);
      }
    }

    @media (max-width: 520px) {
      .back-button {
        left: 14px;
      }

      .legend {
        flex-wrap: wrap;
        white-space: normal;
      }

      .block {
        padding: 12px 8px;
      }

      .final-section {
        padding: 12px 8px;
      }

      .team {
        padding: 5px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" target="_top" class="back-button">← 戻る</a>
  <main class="page">
    <header class="page-header">
      <div>
        <h1>決勝トーナメント</h1>
        <p>各コートの予選勝者による決勝トーナメント</p>
      </div>
      <div class="legend" aria-label="表示の凡例">
        <span><i></i>未確定</span>
        <span class="is-winner"><i></i>勝ち上がり</span>
      </div>
      <button id="refresh-all" class="refresh-button" type="button">すべて更新</button>
      <div id="admin-controls" class="admin-controls" hidden>
        <span>スコアを入力したら、そのコートの「保存」を押してください(自動では保存されません)。ほかの人が入力した内容を見るときや、編集を始める前は「更新」を押して最新にしてください。</span>
        <button id="logout" type="button">ログアウト</button>
      </div>
    </header>

    <section id="podium-section" class="podium-section" aria-labelledby="podium-heading" hidden></section>
    <section id="final-section" class="final-section" aria-labelledby="final-heading"></section>
    <section id="bracket-board" class="bracket-board" aria-label="各コート決勝トーナメント"></section>
    <p id="api-status" class="status">トーナメントデータを読み込み中です。</p>
  </main>

  <div id="name-tip" class="name-tip" role="tooltip" hidden></div>

  <div id="login" class="login" hidden>
    <form id="login-form" class="login-box">
      <h2>管理者ログイン</h2>
      <label>パスワード
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <button id="login-button" type="submit">ログイン</button>
      <a id="login-back" class="login-back" href="index.html" target="_top">← 戻る</a>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </div>

  <script>
    const BLOCKS = ["A", "B", "C"];
    const DEFAULT_BRACKET_SIZE = 16;
    const TOURNAMENT_API_BASE_URL = "https://script.google.com/macros/s/AKfycbxvILecly2-0USLwyEVnumxpNwqb8HvDDR_LBzvmUmJXoNEJOR95eusY7q05yJNtGyfSg/exec";
    const WANT_ADMIN = new URLSearchParams(window.location.search).get("admin") === "1";
    const TOKEN_KEY = "rrst_admin_token";

    // ログイン済みのときだけ値が入る。入力欄・自動保存は isAdmin() のときだけ有効
    let adminToken = "";
    const isAdmin = () => WANT_ADMIN && Boolean(adminToken);

    function newBlockState() {
      return {
        matches: [],
        bracketSize: DEFAULT_BRACKET_SIZE,
        qualifier: null,
        updatedAt: null,
        pendingBlocks: [],
        blockCount: 0,
        loading: false,
        error: "",
        saving: false,
        saveError: "",
        // シートが無いコート(将来AとBだけになったときのCなど)。true のときは表示から外す
        missing: false
      };
    }

    // 表示・入力の対象になっているコート(シートが見つからないコートは除く)
    function activeBlocks() {
      return BLOCKS.filter(block => !tournamentData[block].missing);
    }

    const tournamentData = {
      A: newBlockState(),
      B: newBlockState(),
      C: newBlockState(),
      // 最終決戦のスコアと、三すくみのときの手動順位(サーバーから取得)
      final: { rows: [], podium: [], updatedAt: null, loading: false, error: "", saving: false, saveError: "" },
      finalMatches: []
    };

    // 三すくみの順位: 選んだ内容はすぐ画面に残し(draft)、あとでまとめて保存する。
    // 保存の返事が来る前に描き直されても、選んだ順位が「未設定」に戻らないようにする。
    // 保存していない入力があるブロック("A"/"B"/"C"/"FINAL")
    const dirtyKeys = new Set();

    const podiumDraft = { 1: "", 2: "", 3: "", dirty: false, state: "", error: false };

    // ---------------------------------------------------------------
    // 表示
    // ---------------------------------------------------------------

    function escapeHtml(value) {
      return String(value === undefined || value === null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatTime(milliseconds) {
      return new Date(milliseconds).toLocaleTimeString("ja-JP", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function getMatch(block, round, matchIndex) {
      return tournamentData[block].matches.find(
        match => match.round === round && match.match === matchIndex
      ) || {};
    }

    // options.block があり、両方の選手が決まっている試合だけ管理者用のスコア入力欄を出す
    function teamMarkup(team, options = {}) {
      const name = team && team.name && team.name !== "出場者未定" ? team.name : "";
      const number = team && team.number ? `${team.number}番 ` : "";

      if (!name && !number) {
        return options.placeholder
          ? `<div class="team is-empty"><span class="team-name">未定</span></div>`
          : "";
      }

      // 代表がまだ決まっていないブロック
      if (team.pending) {
        return `<div class="team is-empty"><span class="team-name">${escapeHtml(name)}</span></div>`;
      }

      const score = team && team.score !== undefined && team.score !== "" ? team.score : "";
      const winner = team && team.winner ? " is-winner" : "";
      const scoreMarkup = options.bye
        ? ""
        : isAdmin() && options.editable
        ? `<input class="score-input" type="number" min="0" inputmode="numeric" data-block="${options.block}" data-round="${options.round}" data-match="${options.matchIndex}" data-color="${options.color}" value="${escapeHtml(score)}"${options.disabled ? " disabled" : ""}>`
        : `<span class="team-score">${score === "" ? "-" : escapeHtml(score)}</span>`;

      return `<div class="team${winner}">
        <span class="team-name">${escapeHtml(number + name)}</span>
        ${scoreMarkup}
      </div>`;
    }

    // 決勝から数えて名前を付ける(枠数が変わっても正しい名前になる)
    function roundNames(bracketSize) {
      const total = Math.log2(bracketSize);
      const fromEnd = ["準決勝", "準々決勝"]; // ブロック内は準決勝どまり(決勝は最終決戦で行う)
      return Array.from({ length: total }, (_, round) =>
        fromEnd[total - 1 - round] || `${round + 1}回戦`
      );
    }

    function matchMarkup(block, round, matchIndex) {
      const match = getMatch(block, round, matchIndex);
      const hasRed = Boolean(match.red && (match.red.name || match.red.number));
      const hasBlue = Boolean(match.blue && (match.blue.name || match.blue.number));

      // 1回戦で誰もいない枠は描かない。2回戦以降は「未定」の枠を常に出す
      if (round === 0 && !hasRed && !hasBlue) return "";

      const rowSpan = 2 ** (round + 1);
      const rowStart = (matchIndex - 1) * rowSpan + 1;
      const isBye = round === 0 && (!hasRed || !hasBlue);
      const advanced = Boolean(match.winner || match.bye);
      const feederAdvanced = round > 0 && [
        getMatch(block, round - 1, matchIndex * 2 - 1),
        getMatch(block, round - 1, matchIndex * 2)
      ].some(feeder => feeder.winner || feeder.bye);
      const editable = Boolean(
        hasRed && hasBlue && !match.red.pending && !match.blue.pending
      );

      const slotClass = [
        "slot",
        matchIndex % 2 === 1 ? "is-upper" : "is-lower",
        advanced ? "is-advanced" : ""
      ].join(" ");
      const matchClass = [
        "match",
        isBye ? "is-bye" : "",
        !isBye && match.number ? "has-number" : "",
        feederAdvanced ? "is-fed" : ""
      ].join(" ");
      // 試合番号はサーバー側で「不戦勝を除いて1回戦から順番」に付けている
      const matchNumberMarkup = !isBye && match.number
        ? `<span class="match-number">第${match.number}試合<span>スコア</span></span>`
        : "";
      const placeholder = round > 0;

      return `<div class="${slotClass}" style="grid-row: ${rowStart} / span ${rowSpan};">
        <article class="${matchClass}">
          ${matchNumberMarkup}
          ${teamMarkup(match.red, { block, round, matchIndex, color: "red", placeholder, editable, bye: isBye, disabled: tournamentData[block].saving })}
          ${teamMarkup(match.blue, { block, round, matchIndex, color: "blue", placeholder, editable, bye: isBye, disabled: tournamentData[block].saving })}
        </article>
      </div>`;
    }

    function blockNoteMarkup(data) {
      if (data.error) {
        return `<p class="block-note is-error">取得できませんでした: ${escapeHtml(data.error)}</p>`;
      }
      if (data.saveError) {
        return `<p class="block-note is-error">保存に失敗しました: ${escapeHtml(data.saveError)}(入力内容は残っています。もう一度「保存」を押してください)</p>`;
      }
      // 管理者にだけ、代表が取れていないブロックを知らせる(原因調べ用)
      if (isAdmin() && data.pendingBlocks.length) {
        const list = data.pendingBlocks.map(id => `第${id}`).join("・");
        const got = data.blockCount - data.pendingBlocks.length;
        return `<p class="block-note">代表を取得できているブロック: ${got}/${data.blockCount}(未取得: ${list}ブロック)</p>`;
      }
      return "";
    }

    function blockMarkup(block) {
      const data = tournamentData[block];
      const bracketSize = data.bracketSize || DEFAULT_BRACKET_SIZE;
      const names = roundNames(bracketSize);
      const updated = data.updatedAt ? `更新 ${formatTime(data.updatedAt)}` : "未取得";

      return `<section class="block" data-block="${block}" aria-labelledby="block-${block}">
        <div class="block-heading">
          <h2 id="block-${block}">${block}コート</h2>
          <div class="block-tools">
            <span class="updated">${updated}</span>
            <button type="button" class="refresh-button" data-refresh="${block}"${data.loading ? " disabled" : ""}>${data.loading ? "更新中…" : "更新"}</button>
            ${isAdmin() ? `<button type="button" class="save-button${dirtyKeys.has(block) ? " is-dirty" : ""}" data-save="${block}"${data.saving ? " disabled" : ""}>${data.saving ? "保存中…" : "保存"}</button>` : ""}
          </div>
        </div>
        ${isAdmin() ? `<p class="dirty-note" data-dirty-note="${block}">${dirtyKeys.has(block) ? "未保存の変更があります" : ""}</p>` : ""}
        ${blockNoteMarkup(data)}
        <div class="rounds-scroll">
          <div class="rounds" style="--slot-count: ${bracketSize}; --round-count: ${names.length};">
            ${names.map((name, round) => `
              <div class="round">
                <span class="round-label">${name}</span>
                <div class="round-grid">
                  ${Array.from({ length: bracketSize / (2 ** (round + 1)) }, (_, index) =>
                    matchMarkup(block, round, index + 1)
                  ).join("")}
                </div>
              </div>
            `).join("")}
          </div>
        </div>
      </section>`;
    }

    function podiumMarkup() {
      const standings = finalStandings();
      if (standings.status !== "decided") return "";

      return `<div class="podium-heading">
        <h2 id="podium-heading">表彰</h2>
        <span>最終決戦の結果${standings.source === "manual" ? "(三すくみのため運営が決定)" : ""}</span>
      </div>
      <ol class="podium">
        ${standings.order.map((team, index) => `<li class="podium-item rank-${index + 1}">
          <span class="podium-rank">${index + 1}位</span>
          <span class="podium-name">${escapeHtml((team.number ? team.number + "番 " : "") + team.name)}</span>
        </li>`).join("")}
      </ol>`;
    }

    // 三すくみ(全員1勝1敗)のときだけ出す。管理者は順位を選び、閲覧者には案内だけ出す
    function tieMarkup() {
      const standings = finalStandings();
      const isTie = standings.status === "tie" ||
        (standings.status === "decided" && standings.source === "manual");
      if (!isTie) return "";

      if (!isAdmin()) {
        return `<p class="final-pending">全員1勝1敗のため、順位は運営が決定します。</p>`;
      }

      const current = {};
      if (podiumDraft.dirty) {
        [1, 2, 3].forEach(rank => { current[rank] = podiumDraft[rank]; });
      } else {
        tournamentData.final.podium.forEach(item => {
          current[item.rank] = `${item.number || ""}|${item.name}`;
        });
      }
      const stateText = podiumDraft.state ||
        (standings.status === "decided" ? "保存済み" : "1〜3位をすべて選ぶと表彰欄に反映されます");

      return `<div class="tie-box">
        <span>三すくみ(全員1勝1敗)です。順位を設定してください。</span>
        <span class="tie-state${podiumDraft.error ? " is-error" : ""}">${escapeHtml(stateText)}</span>
        <div class="tie-selects">
          ${[1, 2, 3].map(rank => `<label>${rank}位
            <select class="podium-select" data-rank="${rank}">
              <option value="">未設定</option>
              ${standings.teams.map(team => `<option value="${escapeHtml(teamKey(team))}"${current[rank] === teamKey(team) ? " selected" : ""}>${escapeHtml((team.number ? team.number + "番 " : "") + team.name)}</option>`).join("")}
            </select>
          </label>`).join("")}
        </div>
      </div>`;
    }

    // 3コートなら「最終決戦」(総当たり3試合)、2コートなら「決勝・3位決定戦」の2試合に切り替える
    function finalMarkup() {
      const active = activeBlocks();
      const twoCourtMode = active.length === 2;
      const matches = tournamentData.finalMatches || [];
      const finalData = tournamentData.final;
      const updated = finalData.updatedAt ? `更新 ${formatTime(finalData.updatedAt)}` : "未取得";
      const title = twoCourtMode ? "決勝・3位決定戦" : "最終決戦";

      let subtitle;
      if (twoCourtMode) {
        subtitle = matches.length
          ? `${active.join("・")}コート代表による決勝`
          : `${active.length || 2}コートの代表決定後に組み合わせを表示`;
      } else {
        subtitle = matches.length === 3
          ? "A・B・Cコート代表の総当たり"
          : "3コートの代表決定後に組み合わせを表示";
      }

      const head = `<div class="final-heading">
        <h2 id="final-heading">${title}</h2>
        <div class="block-tools">
          <span>${subtitle}</span>
          <span class="updated">${updated}</span>
          <button type="button" class="refresh-button" data-refresh-final${finalData.loading ? " disabled" : ""}>${finalData.loading ? "更新中…" : "更新"}</button>
          ${isAdmin() ? `<button type="button" class="save-button${dirtyKeys.has("FINAL") ? " is-dirty" : ""}" data-save-final${finalData.saving ? " disabled" : ""}>${finalData.saving ? "保存中…" : "保存"}</button>` : ""}
        </div>
      </div>
      ${isAdmin() ? `<p class="dirty-note" data-dirty-note="FINAL">${dirtyKeys.has("FINAL") ? "未保存の変更があります" : ""}</p>` : ""}
      ${finalData.saveError ? `<p class="block-note is-error">保存に失敗しました: ${escapeHtml(finalData.saveError)}(入力内容は残っています。もう一度「保存」を押してください)</p>` : ""}
      ${finalData.error ? `<p class="block-note is-error">取得できませんでした: ${escapeHtml(finalData.error)}</p>` : ""}`;

      function matchCard(match, index, label) {
        const options = { block: "FINAL", round: 0, matchIndex: index, editable: true, disabled: finalData.saving };
        return `<article class="match has-number">
          <span class="match-number">${label}<span>スコア</span></span>
          ${teamMarkup(match.red, { ...options, color: "red" })}
          ${teamMarkup(match.blue, { ...options, color: "blue" })}
        </article>`;
      }

      if (twoCourtMode) {
        const decisive = matches[0];
        const third = matches[1];
        if (!decisive) {
          return `${head}<p class="final-pending">${active.join("・")}の代表が決まると、ここに決勝を表示します。</p>`;
        }
        const cards = [matchCard(decisive, 1, "決勝")];
        cards.push(third
          ? matchCard(third, 2, "3位決定戦")
          : `<p class="final-pending">両コートの準決勝で敗れた選手が決まると、3位決定戦を表示します。</p>`);
        return `${head}<div class="final-matches">${cards.join("")}</div>`;
      }

      const isReady = matches.length === 3 && matches.every(match =>
        match.red && match.red.name && match.blue && match.blue.name
      );
      return `${head}${isReady ? `<div class="final-matches">
        ${[0, 1, 2].map((index) => matchCard(matches[index] || {}, index + 1, `最終第${index + 1}試合`)).join("")}
      </div>${tieMarkup()}` : `<p class="final-pending">A・B・Cの代表が全員決まると、ここに最終3試合を表示します。</p>`}`;
    }

    // 描画し直しても、入力中のスコア・フォーカス・横スクロール位置を失わないようにする
    function inputKey(input) {
      const d = input.dataset;
      return `${d.block}-${d.round}-${d.match}-${d.color}`;
    }

    function captureViewState() {
      const active = document.activeElement;
      const state = { values: {}, focus: null, scroll: {} };

      document.querySelectorAll(".score-input").forEach(input => {
        const key = inputKey(input);
        if (input.value !== input.defaultValue) state.values[key] = input.value;
        if (input === active) state.focus = key;
      });
      document.querySelectorAll(".block[data-block]").forEach(section => {
        const scrollEl = section.querySelector(".rounds-scroll") || section;
        state.scroll[section.dataset.block] = scrollEl.scrollLeft;
      });
      return state;
    }

    function restoreViewState(state) {
      document.querySelectorAll(".score-input").forEach(input => {
        const key = inputKey(input);
        if (key in state.values) input.value = state.values[key];
        if (key === state.focus) input.focus();
      });
      document.querySelectorAll(".block[data-block]").forEach(section => {
        const scrollEl = section.querySelector(".rounds-scroll") || section;
        scrollEl.scrollLeft = state.scroll[section.dataset.block] || 0;
      });
    }

    function renderTournament() {
      const state = captureViewState();
      hideNameTip();
      const podium = podiumMarkup();
      const podiumSection = document.getElementById("podium-section");
      podiumSection.innerHTML = podium;
      podiumSection.hidden = !podium;
      document.getElementById("final-section").innerHTML = finalMarkup();
      document.getElementById("bracket-board").innerHTML = activeBlocks()
        .map(blockMarkup)
        .join("");
      restoreViewState(state);
    }

    function setStatus(text, isError = false) {
      const status = document.getElementById("api-status");
      status.textContent = text;
      status.classList.toggle("is-error", isError);
    }

    function updateStatus() {
      const active = activeBlocks();
      const qualified = active.filter(block => tournamentData[block].qualifier).length;
      const label = active.length === 2 ? "決勝・3位決定戦" : "最終戦";
      setStatus(active.length > 0 && qualified === active.length
        ? `${active.join("・")}の代表が確定し、${label}を表示しています。`
        : `代表確定: ${qualified}/${active.length}。最新の結果は各コート右上の「更新」ボタンで取得できます。`);
    }

    // ---------------------------------------------------------------
    // データ取得(手動更新)
    // ---------------------------------------------------------------

    function winnerColor(redScore, blueScore) {
      if (redScore === "" || blueScore === "") return "";
      const red = Number(redScore);
      const blue = Number(blueScore);
      if (Number.isNaN(red) || Number.isNaN(blue) || red === blue) return "";
      return red > blue ? "red" : "blue";
    }

    // A・B・Cの代表がそろったら総当たり3試合を作り、保存済みのスコアを反映する
    function finalMatchesFromQualifiers() {
      const active = activeBlocks();
      const qualifiers = active.map(block => tournamentData[block].qualifier);
      if (qualifiers.some(qualifier => !qualifier || !qualifier.name)) {
        return [];
      }

      // 3コート: A・B・Cの代表による総当たり3試合
      if (active.length === 3) {
        return [
          [qualifiers[0], qualifiers[1]],
          [qualifiers[1], qualifiers[2]],
          [qualifiers[2], qualifiers[0]]
        ].map((teams, index) => buildFinalMatch(index + 1, teams[0], teams[1]));
      }

      // 2コート: 決勝(代表どうし)と、3位決定戦(各コートの準決勝で敗れた側どうし)
      if (active.length === 2) {
        const matches = [buildFinalMatch(1, qualifiers[0], qualifiers[1])];
        const runnerUps = active.map(courtRunnerUp);
        if (runnerUps[0] && runnerUps[1]) {
          matches.push(buildFinalMatch(2, runnerUps[0], runnerUps[1]));
        }
        return matches;
      }

      return [];
    }

    // 保存済みのスコアを反映して1試合ぶんのデータを作る
    function buildFinalMatch(matchNumber, redTeam, blueTeam) {
      const red = { ...redTeam };
      const blue = { ...blueTeam };
      const saved = tournamentData.final.rows.find(row => row.match === matchNumber);
      // 代表(または3位決定戦の相手)が入れ替わっていたら、古いスコアは使わない
      const sameCard = saved && saved.redName === red.name && saved.blueName === blue.name;
      let winner = false;

      if (sameCard) {
        red.score = saved.redScore;
        blue.score = saved.blueScore;
        const color = winnerColor(saved.redScore, saved.blueScore);
        if (color) {
          winner = true;
          (color === "red" ? red : blue).winner = true;
        }
      }

      return { round: null, match: matchNumber, red, blue, winner };
    }

    // そのコートの決勝(表示上は「準決勝」)で敗れた側。3位決定戦の対戦相手になる
    function courtFinalMatch(block) {
      const data = tournamentData[block];
      if (!data || !data.matches || !data.matches.length) return null;
      const finalRound = Math.log2(data.bracketSize || DEFAULT_BRACKET_SIZE) - 1;
      return data.matches.find(match => match.round === finalRound) || null;
    }

    function courtRunnerUp(block) {
      const match = courtFinalMatch(block);
      if (!match || !match.winner) return null;
      const loser = match.red && match.red.winner ? match.blue : match.red;
      return loser && loser.name ? loser : null;
    }

    // ---------------------------------------------------------------
    // 最終決戦の順位(2勝=1位、1勝=2位、0勝=3位。全員1勝1敗なら手動)
    // ---------------------------------------------------------------

    function teamKey(team) {
      return `${team.number || ""}|${team.name}`;
    }

    function manualOrder(teams) {
      const byRank = {};
      tournamentData.final.podium.forEach(item => { byRank[item.rank] = item; });
      const order = [1, 2, 3].map(rank => {
        const item = byRank[rank];
        return item && teams.find(team => teamKey(team) === `${item.number || ""}|${item.name}`);
      });
      const valid = order.every(Boolean) && new Set(order.map(teamKey)).size === 3;
      return valid ? order : null;
    }

    function finalStandings() {
      const active = activeBlocks();

      // 2コート: 決勝の勝者・敗者が1位・2位、3位決定戦の勝者が3位(すべて決まったら表示)
      if (active.length === 2) {
        const matches = tournamentData.finalMatches;
        const decisive = matches[0];
        const third = matches[1];
        if (!decisive || !decisive.winner || !third || !third.winner) {
          return { status: "waiting" };
        }
        const first = decisive.red.winner ? decisive.red : decisive.blue;
        const second = decisive.red.winner ? decisive.blue : decisive.red;
        const thirdPlace = third.red.winner ? third.red : third.blue;
        return { status: "decided", order: [first, second, thirdPlace], source: "auto" };
      }

      if (active.length !== 3) return { status: "waiting" };

      const matches = tournamentData.finalMatches;
      if (matches.length !== 3 || !matches.every(match => match.winner)) {
        return { status: "waiting" };
      }

      const teams = active.map(block => tournamentData[block].qualifier);
      const wins = {};
      teams.forEach(team => { wins[teamKey(team)] = 0; });
      matches.forEach(match => {
        const winner = match.red.winner ? match.red : match.blue;
        wins[teamKey(winner)] += 1;
      });

      const distinct = new Set(teams.map(team => wins[teamKey(team)])).size === 3;
      if (distinct) {
        const order = [...teams].sort((left, right) => wins[teamKey(right)] - wins[teamKey(left)]);
        return { status: "decided", order, source: "auto", teams };
      }

      const manual = manualOrder(teams);
      return manual
        ? { status: "decided", order: manual, source: "manual", teams }
        : { status: "tie", teams };
    }

    function applyLeagueData(block, data) {
      tournamentData[block] = {
        matches: Array.isArray(data.matches) ? data.matches : [],
        bracketSize: data.bracketSize || DEFAULT_BRACKET_SIZE,
        qualifier: data.qualifier && data.qualifier.name ? data.qualifier : null,
        updatedAt: data.generatedAt || Date.now(),
        pendingBlocks: Array.isArray(data.pendingBlocks) ? data.pendingBlocks : [],
        blockCount: data.blockCount || 0,
        loading: false,
        error: "",
        saving: false,
        saveError: "",
        missing: false
      };
    }

    async function postJson(body) {
      const response = await fetch(TOURNAMENT_API_BASE_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(body)
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    async function fetchLeague(block) {
      const requestUrl = new URL(TOURNAMENT_API_BASE_URL);
      requestUrl.searchParams.set("mode", "tournament");
      requestUrl.searchParams.set("league", block);
      requestUrl.searchParams.set("t", Date.now());

      const response = await fetch(requestUrl.toString(), { cache: "no-store" });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      let data;
      try {
        data = JSON.parse(await response.text());
      } catch (parseError) {
        throw new Error("APIがJSONを返していません(公開設定またはURLを確認)");
      }
      if (data.error) throw new Error(data.error);
      return data;
    }

    function applyFinalData(data) {
      tournamentData.final = {
        rows: Array.isArray(data.rows) ? data.rows : [],
        podium: Array.isArray(data.podium) ? data.podium : [],
        updatedAt: data.generatedAt || Date.now(),
        loading: false,
        error: "",
        saving: false,
        saveError: ""
      };
      tournamentData.finalMatches = finalMatchesFromQualifiers();
    }

    async function refreshFinal() {
      if (dirtyKeys.has("FINAL")) {
        if (!window.confirm("最終決戦に未保存の入力があります。更新すると入力した内容は消えます。更新しますか?")) return;
        discardEdits("FINAL");
      }

      tournamentData.final.loading = true;
      renderTournament();

      try {
        const requestUrl = new URL(TOURNAMENT_API_BASE_URL);
        requestUrl.searchParams.set("mode", "final");
        requestUrl.searchParams.set("t", Date.now());
        const response = await fetch(requestUrl.toString(), { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = JSON.parse(await response.text());
        if (data.error) throw new Error(data.error);
        applyFinalData(data);
      } catch (error) {
        console.error("Tournament API error (final):", error);
        tournamentData.final.loading = false;
        tournamentData.final.error = error.message;
      }

      renderTournament();
    }

    // 指定ブロックだけ更新する(ボタンを押したときだけ通信する)
    async function refreshBlocks(blocks) {
      const unsaved = blocks.filter(block => dirtyKeys.has(block));
      if (unsaved.length) {
        const ok = window.confirm(`${unsaved.join("・")}コートに未保存のスコアがあります。更新すると入力した内容は消えます。更新しますか?`);
        if (ok) unsaved.forEach(discardEdits);
        else blocks = blocks.filter(block => !unsaved.includes(block));
      }
      if (!blocks.length) return;

      blocks.forEach(block => { tournamentData[block].loading = true; });
      renderTournament();

      await Promise.all(blocks.map(async block => {
        try {
          applyLeagueData(block, await fetchLeague(block));
        } catch (error) {
          console.error(`Tournament API error (${block}):`, error);
          // シート自体が無い(将来コート数が減った場合)は、エラーにせず静かに非表示にする
          if (/^Sheet not found for league:/.test(error.message)) {
            tournamentData[block] = { ...newBlockState(), missing: true };
          } else {
            tournamentData[block].loading = false;
            tournamentData[block].error = error.message;
          }
        }
      }));

      tournamentData.finalMatches = finalMatchesFromQualifiers();
      renderTournament();
      updateStatus();
    }

    // ---------------------------------------------------------------
    // 管理者: スコア入力 → 自動保存
    // ---------------------------------------------------------------

    let saveChain = Promise.resolve();

    // 保存していない入力があるかどうかを記録し、保存ボタンの色に反映する
    function setDirty(key, isDirty) {
      if (isDirty) dirtyKeys.add(key);
      else dirtyKeys.delete(key);

      const note = document.querySelector(`[data-dirty-note="${key}"]`);
      if (note) note.textContent = isDirty ? "未保存の変更があります" : "";
      const button = document.querySelector(key === "FINAL" ? "[data-save-final]" : `[data-save="${key}"]`);
      if (button) button.classList.toggle("is-dirty", isDirty);
    }

    function discardScoreInputs(key) {
      document.querySelectorAll(`.score-input[data-block="${key}"]`).forEach(input => {
        input.value = input.defaultValue;
      });
    }

    // 入力を捨てて、サーバーの内容に戻す
    function discardEdits(key) {
      discardScoreInputs(key);
      if (key === "FINAL") {
        podiumDraft.dirty = false;
        podiumDraft.state = "";
        podiumDraft.error = false;
      }
      dirtyKeys.delete(key);
    }

    function collectScoreRows(block) {
      const selector = (match, color) =>
        `[data-block="${block}"][data-round="${match.round}"][data-match="${match.match}"][data-color="${color}"]`;

      return tournamentData[block].matches
        .filter(match => match.red && match.blue && !match.red.pending && !match.blue.pending &&
          match.red.name && match.blue.name)
        .map(match => {
          const redInput = document.querySelector(selector(match, "red"));
          const blueInput = document.querySelector(selector(match, "blue"));
          return {
            round: match.round,
            match: match.match,
            redNumber: match.red.number || "",
            redName: match.red.name || "",
            redScore: redInput ? redInput.value : "",
            blueNumber: match.blue.number || "",
            blueName: match.blue.name || "",
            blueScore: blueInput ? blueInput.value : ""
          };
        })
        .filter(row => row.redScore !== "" || row.blueScore !== "");
    }

    async function saveBlock(block) {
      if (!isAdmin()) return;
      // 読み込めていないリーグは保存しない(空のデータで上書きしないため)
      if (!tournamentData[block].matches.length) return;

      const rows = collectScoreRows(block);
      tournamentData[block].saving = true;
      tournamentData[block].saveError = "";
      setStatus(`${block}コートを保存中…`);
      renderTournament();

      try {
        const data = await postJson({ token: adminToken, league: block, matches: rows });
        tournamentData[block].saving = false;

        if (isUnauthorized(data)) return;
        if (data.error) throw new Error(data.error);

        // 保存直後の最新データ(勝ち上がり反映済み)がそのまま返ってくる
        discardEdits(block);
        applyLeagueData(block, data.data);
        tournamentData.finalMatches = finalMatchesFromQualifiers();
        renderTournament();
        setStatus(`${block}コートを保存し、勝ち上がりを反映しました(${formatTime(Date.now())})`);
      } catch (error) {
        tournamentData[block].saving = false;
        tournamentData[block].saveError = error.message;
        renderTournament();
        setStatus(`保存に失敗しました: ${error.message}`, true);
      }
    }

    function isUnauthorized(data) {
      if (data.error !== "Unauthorized") return false;
      logout("パスワードが無効になりました。もう一度ログインしてください。");
      return true;
    }

    function collectFinalRows() {
      const input = (match, color) => document.querySelector(
        `[data-block="FINAL"][data-match="${match.match}"][data-color="${color}"]`
      );

      return tournamentData.finalMatches
        .map(match => ({
          round: 0,
          match: match.match,
          redNumber: match.red.number || "",
          redName: match.red.name || "",
          redScore: input(match, "red") ? input(match, "red").value : "",
          blueNumber: match.blue.number || "",
          blueName: match.blue.name || "",
          blueScore: input(match, "blue") ? input(match, "blue").value : ""
        }))
        .filter(row => row.redScore !== "" || row.blueScore !== "");
    }

    // 最終決戦のスコアだけを保存する。成功したら true
    async function saveFinal() {
      if (!isAdmin() || !tournamentData.finalMatches.length) return true;

      const rows = collectFinalRows();
      tournamentData.final.saving = true;
      tournamentData.final.saveError = "";
      renderTournament();

      try {
        const data = await postJson({ token: adminToken, league: "FINAL", matches: rows });
        tournamentData.final.saving = false;

        if (isUnauthorized(data)) return false;
        if (data.error) throw new Error(data.error);

        discardScoreInputs("FINAL");
        applyFinalData(data.data);
        renderTournament();
        return true;
      } catch (error) {
        tournamentData.final.saving = false;
        tournamentData.final.saveError = error.message;
        renderTournament();
        return false;
      }
    }

    // 三すくみのときの順位(手動)。選んだだけでは保存しない
    function onPodiumChange() {
      document.querySelectorAll(".podium-select").forEach(select => {
        podiumDraft[Number(select.dataset.rank)] = select.value;
      });
      podiumDraft.dirty = true;

      const chosen = [1, 2, 3].map(rank => podiumDraft[rank]).filter(Boolean);
      if (new Set(chosen).size !== chosen.length) {
        podiumDraft.state = "同じ選手を複数の順位に設定することはできません。";
        podiumDraft.error = true;
      } else {
        podiumDraft.state = "未保存です。「保存」を押してください。";
        podiumDraft.error = false;
      }

      setDirty("FINAL", true);
      const note = document.querySelector(".tie-state");
      if (note) {
        note.textContent = podiumDraft.state;
        note.classList.toggle("is-error", podiumDraft.error);
      }
    }

    async function savePodium() {
      if (!isAdmin()) return true;

      const snapshot = { 1: podiumDraft[1], 2: podiumDraft[2], 3: podiumDraft[3] };
      const chosen = [1, 2, 3].map(rank => snapshot[rank]).filter(Boolean);
      if (new Set(chosen).size !== chosen.length) {
        podiumDraft.state = "同じ選手を複数の順位に設定することはできません。";
        podiumDraft.error = true;
        renderTournament();
        return false;
      }

      const teams = BLOCKS.map(block => tournamentData[block].qualifier).filter(Boolean);
      const rows = [1, 2, 3]
        .filter(rank => snapshot[rank] !== "")
        .map(rank => {
          const team = teams.find(candidate => teamKey(candidate) === snapshot[rank]);
          return { round: rank, match: 1, redNumber: team.number || "", redName: team.name };
        });

      try {
        podiumDraft.state = "保存中…";
        podiumDraft.error = false;
        renderTournament();

        const data = await postJson({ token: adminToken, league: "PODIUM", matches: rows });
        if (isUnauthorized(data)) return false;
        if (data.error) throw new Error(data.error);

        applyFinalData(data.data);
        // 保存中にさらに選び直していたら、その分は未保存のまま残す
        const unchanged = [1, 2, 3].every(rank => podiumDraft[rank] === snapshot[rank]);
        podiumDraft.dirty = !unchanged;
        podiumDraft.state = unchanged ? "" : "未保存です。「保存」を押してください。";
        renderTournament();
        return true;
      } catch (error) {
        podiumDraft.state = `保存に失敗しました: ${error.message}`;
        podiumDraft.error = true;
        renderTournament();
        return false;
      }
    }

    // 最終決戦の「保存」ボタン: スコアと(三すくみのときの)順位をまとめて保存する
    async function saveFinalAll() {
      if (!isAdmin()) return;

      setStatus("最終決戦を保存中…");
      const scoresOk = await saveFinal();
      const podiumOk = podiumDraft.dirty ? await savePodium() : true;

      if (scoresOk && podiumOk && !podiumDraft.dirty) {
        setDirty("FINAL", false);
        setStatus(`最終決戦を保存しました(${formatTime(Date.now())})`);
      } else {
        setStatus("保存できていない内容があります。もう一度「保存」を押してください。", true);
      }
    }

    // ---------------------------------------------------------------
    // 管理者: パスワード
    // ---------------------------------------------------------------

    function storedToken() {
      try { return sessionStorage.getItem(TOKEN_KEY) || ""; } catch (error) { return ""; }
    }

    function storeToken(token) {
      try {
        if (token) sessionStorage.setItem(TOKEN_KEY, token);
        else sessionStorage.removeItem(TOKEN_KEY);
      } catch (error) { /* 保存できなくても動く */ }
    }

    async function verifyPassword(token) {
      const data = await postJson({ action: "verify", token });
      return Boolean(data && data.ok);
    }

    function showLogin(message = "") {
      document.getElementById("login").hidden = false;
      document.getElementById("login-error").textContent = message;
      document.getElementById("login-password").focus();
    }

    function enterAdmin(token) {
      adminToken = token;
      storeToken(token);
      document.getElementById("login").hidden = true;
      document.getElementById("admin-controls").hidden = false;
      document.getElementById("login-password").value = "";
      renderTournament();
    }

    function logout(message = "") {
      adminToken = "";
      storeToken("");
      dirtyKeys.clear();
      podiumDraft.dirty = false;
      podiumDraft.state = "";
      document.getElementById("admin-controls").hidden = true;
      renderTournament();
      showLogin(message);
    }

    async function initAdmin() {
      if (!WANT_ADMIN) return;

      showLogin();
      const saved = storedToken();
      if (!saved) return;

      try {
        if (await verifyPassword(saved)) enterAdmin(saved);
        else storeToken("");
      } catch (error) {
        storeToken("");
      }
    }

    document.getElementById("login-form").addEventListener("submit", async event => {
      event.preventDefault();
      const password = document.getElementById("login-password").value;
      const button = document.getElementById("login-button");
      const error = document.getElementById("login-error");

      button.disabled = true;
      error.textContent = "確認しています…";
      try {
        if (await verifyPassword(password)) {
          enterAdmin(password);
        } else {
          error.textContent = "パスワードが違います。";
        }
      } catch (failure) {
        error.textContent = `確認できませんでした: ${failure.message}`;
      } finally {
        button.disabled = false;
      }
    });

    document.getElementById("logout").addEventListener("click", () => logout());

    // ---------------------------------------------------------------
    // イベント
    // ---------------------------------------------------------------

    document.getElementById("bracket-board").addEventListener("click", event => {
      const refresh = event.target.closest("[data-refresh]");
      if (refresh) refreshBlocks([refresh.dataset.refresh]);

      const save = event.target.closest("[data-save]");
      if (save && isAdmin()) {
        const block = save.dataset.save;
        saveChain = saveChain.then(() => saveBlock(block));
      }
    });

    // 入力したら「未保存」の印を付ける(保存はボタンを押したときだけ)
    function onScoreInput(event) {
      const input = event.target.closest(".score-input");
      if (input && isAdmin()) setDirty(input.dataset.block, true);
    }

    document.getElementById("bracket-board").addEventListener("input", onScoreInput);
    document.getElementById("final-section").addEventListener("input", onScoreInput);
    document.getElementById("final-section").addEventListener("change", event => {
      if (event.target.closest(".podium-select")) onPodiumChange();
    });

    document.getElementById("final-section").addEventListener("click", event => {
      if (event.target.closest("[data-refresh-final]")) refreshFinal();
      if (event.target.closest("[data-save-final]")) {
        saveChain = saveChain.then(saveFinalAll);
      }
    });

    // 未保存の入力があるままページを閉じる・移動しようとしたら確認する
    window.addEventListener("beforeunload", event => {
      if (dirtyKeys.size) {
        event.preventDefault();
        event.returnValue = "";
      }
    });

    function refreshAll() {
      return Promise.all([refreshBlocks(BLOCKS), refreshFinal()]);
    }

    document.getElementById("refresh-all").addEventListener("click", refreshAll);

    // ---------------------------------------------------------------
    // 長い名前: タップ(PCはカーソルを載せる)で全文を上に出す。ほかをタップすると消える
    // ---------------------------------------------------------------

    const nameTip = document.getElementById("name-tip");

    function hideNameTip() {
      nameTip.hidden = true;
    }

    function showNameTip(element) {
      // 省略されていない名前では出さない
      if (element.scrollWidth <= element.clientWidth + 1) {
        hideNameTip();
        return;
      }

      nameTip.textContent = element.textContent;
      nameTip.hidden = false;

      const rect = element.getBoundingClientRect();
      const tip = nameTip.getBoundingClientRect();
      const left = Math.min(Math.max(8, rect.left), window.innerWidth - tip.width - 8);
      const above = rect.top - tip.height - 8;
      nameTip.style.left = `${Math.max(8, left)}px`;
      nameTip.style.top = `${above >= 8 ? above : rect.bottom + 8}px`;
    }

    document.addEventListener("pointerover", event => {
      if (event.pointerType !== "mouse") return;
      const element = event.target.closest(".team-name");
      if (element) showNameTip(element);
    });
    document.addEventListener("pointerout", event => {
      if (event.pointerType !== "mouse") return;
      if (event.target.closest(".team-name")) hideNameTip();
    });
    document.addEventListener("click", event => {
      const element = event.target.closest(".team-name");
      if (element) showNameTip(element);
      else hideNameTip();
    });
    window.addEventListener("scroll", hideNameTip, true);
    window.addEventListener("resize", hideNameTip);

    // 開いたときに1回だけ取得する。以降は「更新」ボタンを押したときだけ通信する。
    renderTournament();
    initAdmin();
    refreshAll();
  </script>
</body>
</html>
