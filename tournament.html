<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トーナメント表 - 立命杯2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1e24;
      --primary-light: #a54c52;
      --ink: #242124;
      --muted: #777176;
      --line: #d4cdd0;
      --winner: #c58a18;
      --surface: #fff;
    }

    html, body {
      min-height: 100%;
      background: #f4f0ee;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      padding: 72px 24px 32px;
    }

    .page {
      width: min(1480px, 100%);
      margin: 0 auto;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 24px;
      z-index: 10;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgb(65 25 28 / 18%);
      transition: background-color 0.2s, transform 0.2s;
    }

    .back-button:hover {
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      display: inline-block;
      width: 24px;
      height: 3px;
      background: var(--line);
    }

    .legend .is-winner i {
      background: var(--winner);
    }

    .admin-controls {
      display: flex;
      align-items: end;
      gap: 8px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .admin-controls[hidden] {
      display: none !important;
    }

    .admin-controls label {
      display: grid;
      gap: 3px;
      color: var(--muted);
      font-size: 0.7rem;
    }

    .admin-controls input {
      width: 150px;
      min-height: 30px;
      padding: 4px 6px;
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .admin-controls button {
      min-height: 30px;
      padding: 4px 10px;
      color: #fff;
      background: var(--primary);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .status.is-error {
      color: #b3261e;
    }

    .final-pending {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .bracket-board {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      overflow-x: visible;
    }

    .final-section {
      margin-bottom: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--winner);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .final-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .final-heading h2 {
      font-size: 1.3rem;
    }

    .final-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .final-matches {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 8px;
    }

    .final-matches .match {
      width: 100%;
    }

    .final-matches .match::before,
    .final-matches .match::after {
      display: none;
    }

    .block {
      min-width: 0;
      padding: 10px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .block-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .block-heading h2 {
      font-size: 1.1rem;
    }

    .block-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* ---- トーナメント本体 ---- */

    .rounds {
      --link: 28px;   /* 回戦と回戦の間(線を引く幅) */
      --row-h: 44px;  /* 1枠あたりの高さ */
      display: grid;
      grid-template-columns: repeat(var(--round-count), minmax(0, 1fr));
      column-gap: var(--link);
    }

    .round {
      min-width: 0;
    }

    .round-label {
      display: block;
      height: 14px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: bold;
      text-align: center;
    }

    .round-grid {
      display: grid;
      grid-template-rows: repeat(var(--slot-count), var(--row-h));
      margin-top: 8px;
    }

    /* 1試合ぶんの場所。線はここに描く */
    .slot {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .match {
      position: relative;
      width: 100%;
      border: 2px solid #222;
      background: #fff;
    }

    /* 右へ伸びる横線(勝ち上がり) */
    .round:not(:last-child) .slot::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 100%;
      width: calc(var(--link) / 2);
      height: 3px;
      margin-top: -1.5px;
      background: var(--line);
    }

    /* 2試合をつなぐ縦線。上の試合は下へ、下の試合は上へ */
    .round:not(:last-child) .slot::before {
      content: "";
      position: absolute;
      left: calc(100% + var(--link) / 2 - 1.5px);
      width: 3px;
      background: var(--line);
    }

    .slot.is-upper::before {
      top: 50%;
      height: 50%;
    }

    .slot.is-lower::before {
      top: 0;
      height: 50%;
    }

    /* 次の試合の左側に入る横線 */
    .round:not(:first-child) .match::before {
      content: "";
      position: absolute;
      top: 50%;
      left: calc(var(--link) / -2);
      width: calc(var(--link) / 2);
      height: 3px;
      margin-top: -1.5px;
      background: var(--line);
    }

    /* 勝ち上がった線は金色 */
    .slot.is-advanced::before,
    .slot.is-advanced::after,
    .match.is-fed::before {
      background: var(--winner);
    }

    .match.is-bye {
      border: 0;
      background: transparent;
    }

    .match.is-bye .team {
      border: 2px solid #222;
      border-radius: 12px;
      background: #fff;
    }

    .match-number {
      display: block;
      padding: 2px 4px;
      color: var(--muted);
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 0.6rem;
    }

    .match-number span {
      float: right;
      color: var(--muted);
      font-weight: normal;
    }

    .team {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 30px;
      gap: 4px;
      padding: 3px 4px;
      font-size: 0.64rem;
    }

    .team + .team {
      border-top: 1px solid #eee9e9;
    }

    .team-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-score {
      flex: 0 0 auto;
      min-width: 22px;
      color: var(--muted);
      text-align: right;
      font-weight: bold;
    }

    .score-input {
      width: 30px;
      min-height: 22px;
      padding: 1px 2px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 3px;
      text-align: center;
    }

    /* 勝った側の選手だけを黄色で囲む */
    .team.is-winner {
      color: #875d06;
      font-weight: bold;
      background: #fff8e6;
      outline: 3px solid var(--winner);
      outline-offset: -3px;
    }

    /* まだ相手が決まっていない枠 */
    .team.is-empty {
      color: #b5aeb2;
    }

    @media (max-width: 900px) {
      body {
        padding: 72px 14px 24px;
      }

      .page-header {
        align-items: start;
        flex-direction: column;
      }

      .bracket-board {
        grid-template-columns: 1fr;
      }

      .final-matches {
        grid-template-columns: 1fr;
      }

      /* 狭い画面では横にスクロールして読めるようにする */
      .block {
        overflow-x: auto;
      }

      .rounds {
        --link: 20px;
        min-width: calc(var(--round-count) * 128px);
      }
    }

    @media (max-width: 520px) {
      .back-button {
        left: 14px;
      }

      .legend {
        flex-wrap: wrap;
        white-space: normal;
      }

      .block {
        padding: 12px 8px;
      }

      .final-section {
        padding: 12px 8px;
      }

      .team {
        padding: 5px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-button">← 戻る</a>
  <main class="page">
    <header class="page-header">
      <div>
        <h1>決勝トーナメント</h1>
        <p>各ブロックの予選勝者による決勝トーナメント</p>
      </div>
      <div class="legend" aria-label="表示の凡例">
        <span><i></i>未確定</span>
        <span class="is-winner"><i></i>勝ち上がり</span>
      </div>
      <div id="admin-controls" class="admin-controls" hidden>
        <label>管理トークン <input id="admin-token" type="password" autocomplete="off"></label>
        <button id="save-scores" type="button">スコアを保存</button>
      </div>
    </header>

    <section id="final-section" class="final-section" aria-labelledby="final-heading"></section>
    <section id="bracket-board" class="bracket-board" aria-label="各ブロック決勝トーナメント"></section>
    <p id="api-status" class="status">トーナメントデータを読み込み中です。</p>
  </main>

  <script>
    const BLOCKS = ["A", "B", "C"];
    const DEFAULT_BRACKET_SIZE = 16;
    const TOURNAMENT_API_BASE_URL = "https://script.google.com/macros/s/AKfycbyAPO3XOKBB4nJb_1x47j4HxGDsLG0aD4DLI7HcaVbeKDf4rbKJpco4aD0X7i7QgMlE9g/exec";
    const TOURNAMENT_API_URLS = {
      A: TOURNAMENT_API_BASE_URL + "?mode=tournament&league=A",
      B: TOURNAMENT_API_BASE_URL + "?mode=tournament&league=B",
      C: TOURNAMENT_API_BASE_URL + "?mode=tournament&league=C"
    };
    const IS_ADMIN = new URLSearchParams(window.location.search).get("admin") === "1";

    const tournamentData = {
      A: { matches: [] },
      B: { matches: [] },
      C: { matches: [] },
      finalMatches: []
    };

    function getMatch(block, round, matchIndex) {
      return tournamentData[block].matches.find(
        match => match.round === round && match.match === matchIndex
      ) || {};
    }

    // block を渡したときだけ管理者用のスコア入力欄を出す(最終戦では出さない)
    function teamMarkup(team, block, round, matchIndex, color, placeholder) {
      const name = team && team.name && team.name !== "出場者未定" ? team.name : "";
      const number = team && team.number ? `${team.number}番 ` : "";

      if (!name && !number) {
        return placeholder
          ? `<div class="team is-empty"><span class="team-name">未定</span></div>`
          : "";
      }

      const score = team && team.score !== undefined && team.score !== "" ? team.score : "";
      const winner = team && team.winner ? " is-winner" : "";
      const scoreMarkup = IS_ADMIN && block
        ? `<input class="score-input" type="number" min="0" inputmode="numeric" data-block="${block}" data-round="${round}" data-match="${matchIndex}" data-color="${color}" value="${score}">`
        : `<span class="team-score">${score === "" ? "-" : score}</span>`;

      return `<div class="team${winner}">
        <span class="team-name">${number}${name}</span>
        ${scoreMarkup}
      </div>`;
    }

    // 決勝から数えて名前を付ける(枠数が変わっても正しい名前になる)
    function roundNames(bracketSize) {
      const total = Math.log2(bracketSize);
      const fromEnd = ["決勝", "準決勝", "準々決勝"];
      return Array.from({ length: total }, (_, round) =>
        fromEnd[total - 1 - round] || `${round + 1}回戦`
      );
    }

    function roundOffset(bracketSize, round) {
      let offset = 0;
      for (let index = 0; index < round; index += 1) {
        offset += bracketSize / (2 ** (index + 1));
      }
      return offset;
    }

    function matchMarkup(block, round, matchIndex, bracketSize) {
      const match = getMatch(block, round, matchIndex);
      const hasRed = Boolean(match.red && (match.red.name || match.red.number));
      const hasBlue = Boolean(match.blue && (match.blue.name || match.blue.number));

      // 1回戦で誰もいない枠は描かない。2回戦以降は「未定」の枠を常に出す
      if (round === 0 && !hasRed && !hasBlue) return "";

      const rowSpan = 2 ** (round + 1);
      const rowStart = (matchIndex - 1) * rowSpan + 1;
      const totalMatchNumber = roundOffset(bracketSize, round) + matchIndex;
      const isBye = round === 0 && (!hasRed || !hasBlue);
      const advanced = Boolean(match.winner || match.bye);
      const feederAdvanced = round > 0 && [
        getMatch(block, round - 1, matchIndex * 2 - 1),
        getMatch(block, round - 1, matchIndex * 2)
      ].some(feeder => feeder.winner || feeder.bye);

      const slotClass = [
        "slot",
        matchIndex % 2 === 1 ? "is-upper" : "is-lower",
        advanced ? "is-advanced" : ""
      ].join(" ");
      const matchClass = [
        "match",
        isBye ? "is-bye" : "",
        feederAdvanced ? "is-fed" : ""
      ].join(" ");
      const matchNumberMarkup = !isBye
        ? `<span class="match-number">第${totalMatchNumber}試合<span>スコア</span></span>`
        : "";
      const placeholder = round > 0;

      return `<div class="${slotClass}" style="grid-row: ${rowStart} / span ${rowSpan};">
        <article class="${matchClass}">
          ${matchNumberMarkup}
          ${teamMarkup(match.red, block, round, matchIndex, "red", placeholder)}
          ${teamMarkup(match.blue, block, round, matchIndex, "blue", placeholder)}
        </article>
      </div>`;
    }

    function blockMarkup(block) {
      const bracketSize = tournamentData[block].bracketSize || DEFAULT_BRACKET_SIZE;
      const names = roundNames(bracketSize);
      return `<section class="block" aria-labelledby="block-${block}">
        <div class="block-heading">
          <h2 id="block-${block}">${block}コート</h2>
          <span>${bracketSize}枠</span>
        </div>
        <div class="rounds" style="--slot-count: ${bracketSize}; --round-count: ${names.length};">
          ${names.map((name, round) => `
            <div class="round">
              <span class="round-label">${name}</span>
              <div class="round-grid">
                ${Array.from({ length: bracketSize / (2 ** (round + 1)) }, (_, index) =>
                  matchMarkup(block, round, index + 1, bracketSize)
                ).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </section>`;
    }

    function finalMarkup() {
      const matches = tournamentData.finalMatches || [];
      const isReady = matches.length === 3 && matches.every(match =>
        match.red && match.red.name && match.blue && match.blue.name
      );

      return `<div class="final-heading">
        <h2 id="final-heading">最終決戦</h2>
        <span>${isReady ? "A・B・Cコート代表の総当たり" : "3コートの代表決定後に組み合わせを表示"}</span>
      </div>
      ${isReady ? `<div class="final-matches">
        ${[0, 1, 2].map((index) => {
          const match = matches[index] || {};
          return `<article class="match">
            <span class="match-number">最終第${index + 1}試合<span>スコア</span></span>
            ${teamMarkup(match.red)}
            ${teamMarkup(match.blue)}
          </article>`;
        }).join("")}
      </div>` : `<p class="final-pending">A・B・Cの代表が全員決まると、ここに最終3試合を表示します。</p>`}`;
    }

    function renderTournament(data = tournamentData) {
      Object.assign(tournamentData, data);
      document.getElementById("final-section").innerHTML = finalMarkup();
      document.getElementById("bracket-board").innerHTML = BLOCKS
        .map(blockMarkup)
        .join("");
    }

    renderTournament();

    if (IS_ADMIN) {
      document.getElementById("admin-controls").hidden = false;
    }

    function firstQualifier(data) {
      return data && data.qualifier && data.qualifier.name
        ? data.qualifier
        : null;
    }

    function blockPayload(data, block) {
      const sourceBlock = data && data[block];
      if (sourceBlock && Array.isArray(sourceBlock.matches)) {
        return {
          ...sourceBlock,
          bracketSize: data.bracketSize || DEFAULT_BRACKET_SIZE
        };
      }

      const firstBlock = data && Array.isArray(data.blocks) ? data.blocks[0] : null;
      return firstBlock && Array.isArray(firstBlock.matches)
        ? { matches: firstBlock.matches, bracketSize: data.bracketSize || DEFAULT_BRACKET_SIZE }
        : { matches: [], bracketSize: DEFAULT_BRACKET_SIZE };
    }

    function finalMatchesFromQualifiers() {
      const qualifiers = BLOCKS.map(block => tournamentData[block].qualifier);
      if (qualifiers.some(qualifier => !qualifier || !qualifier.name)) {
        return [];
      }

      return [
        [qualifiers[0], qualifiers[1]],
        [qualifiers[1], qualifiers[2]],
        [qualifiers[2], qualifiers[0]]
      ].map((teams, index) => ({
        round: null,
        match: index + 1,
        red: teams[0],
        blue: teams[1],
        winner: false
      }));
    }

    async function loadTournamentData() {
      const status = document.getElementById("api-status");

      try {
        const results = await Promise.all(BLOCKS.map(async block => {
          const url = TOURNAMENT_API_URLS[block];
          if (!url) return { block, data: null };

          const requestUrl = new URL(url);
          requestUrl.searchParams.set("t", Date.now());
          const response = await fetch(requestUrl.toString(), { cache: "no-store" });
          if (!response.ok) throw new Error(`${block}: HTTP ${response.status}`);

          const responseText = await response.text();
          let data;
          try {
            data = JSON.parse(responseText);
          } catch (parseError) {
            throw new Error(`${block}: APIがJSONを返していません（公開設定またはURLを確認）`);
          }
          if (data.error) throw new Error(`${block}: ${data.error}`);
          return { block, data };
        }));

        results.forEach(({ block, data }) => {
          if (!data) return;
          tournamentData[block] = {
            ...blockPayload(data, block),
            qualifier: firstQualifier(data)
          };
        });

        tournamentData.finalMatches = finalMatchesFromQualifiers();
        renderTournament(tournamentData);
        const connected = results.filter(result => result.data).length;
        const qualified = BLOCKS.filter(block => {
          return tournamentData[block].qualifier && tournamentData[block].qualifier.name;
        }).length;
        status.textContent = qualified === 3
          ? "A・B・Cの代表が確定し、最終戦を表示しています。"
          : `${connected}/3ブロックを取得中。代表確定: ${qualified}/3。`;
        status.classList.remove("is-error");
      } catch (error) {
        console.error("Tournament API error:", error);
        status.textContent = `データ取得エラー: ${error.message}`;
        status.classList.add("is-error");
      }
    }

    // A・B・C それぞれを、自分のリーグ名を付けて保存する
    async function saveAdminScores() {
      const status = document.getElementById("api-status");
      const token = document.getElementById("admin-token").value;
      let saved = 0;

      try {
        for (const block of BLOCKS) {
          const source = tournamentData[block].matches;
          // 読み込めていないリーグは保存しない(空のデータで上書きしないため)
          if (!source.length) continue;

          const rows = source
            .filter(match => match.red && match.red.name && match.blue && match.blue.name)
            .map(match => {
              const selector = color =>
                `[data-block="${block}"][data-round="${match.round}"][data-match="${match.match}"][data-color="${color}"]`;
              const redInput = document.querySelector(selector("red"));
              const blueInput = document.querySelector(selector("blue"));

              return {
                round: match.round,
                match: match.match,
                redNumber: match.red.number || "",
                redName: match.red.name || "",
                redScore: redInput ? redInput.value : "",
                blueNumber: match.blue.number || "",
                blueName: match.blue.name || "",
                blueScore: blueInput ? blueInput.value : ""
              };
            });

          const response = await fetch(TOURNAMENT_API_BASE_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ token, league: block, matches: rows })
          });
          const data = await response.json();
          if (data.error) throw new Error(`${block}: ${data.error}`);
          saved += data.saved;
        }

        status.textContent = `${saved}試合を保存しました。`;
        status.classList.remove("is-error");
        await loadTournamentData();
      } catch (error) {
        status.textContent = `保存に失敗しました: ${error.message}`;
        status.classList.add("is-error");
      }
    }

    loadTournamentData();
    // 管理画面では入力中のスコアが消えないよう、自動更新を止める
    setInterval(() => {
      if (!IS_ADMIN) loadTournamentData();
    }, 10000);

    const saveScoresButton = document.getElementById("save-scores");
    if (saveScoresButton) {
      saveScoresButton.addEventListener("click", saveAdminScores);
    }
  </script>
</body>
</html>
