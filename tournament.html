<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>トーナメント表 - 立命杯2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7b1e24;
      --primary-light: #a54c52;
      --ink: #242124;
      --muted: #777176;
      --line: #d4cdd0;
      --winner: #c58a18;
      --surface: #fff;
    }

    html, body {
      min-height: 100%;
      background: #f4f0ee;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
    }

    body {
      padding: 72px 24px 32px;
    }

    .page {
      width: min(1480px, 100%);
      margin: 0 auto;
    }

    .back-button {
      position: fixed;
      top: 16px;
      left: 24px;
      z-index: 10;
      background-color: var(--primary);
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 4px 12px rgb(65 25 28 / 18%);
      transition: background-color 0.2s, transform 0.2s;
    }

    .back-button:hover {
      background-color: var(--primary-light);
      transform: translateY(-1px);
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      letter-spacing: 0.04em;
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 14px;
      color: var(--muted);
      font-size: 0.82rem;
      white-space: nowrap;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend i {
      display: inline-block;
      width: 24px;
      height: 3px;
      background: var(--line);
    }

    .legend .is-winner i {
      background: var(--winner);
    }

    .bracket-board {
      display: grid;
      grid-template-columns: repeat(3, minmax(360px, 1fr));
      gap: 18px;
      overflow-x: auto;
    }

    .final-section {
      margin-bottom: 22px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--winner);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .final-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .final-heading h2 {
      font-size: 1.3rem;
    }

    .final-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .final-matches {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 12px;
    }

    .final-matches .match::after {
      display: none;
    }

    .block {
      min-width: 0;
      padding: 18px;
      background: var(--surface);
      border: 1px solid #e4dcde;
      border-top: 5px solid var(--primary);
      border-radius: 12px;
      box-shadow: 0 8px 22px rgb(75 36 40 / 9%);
    }

    .block-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .block-heading h2 {
      font-size: 1.3rem;
    }

    .block-heading span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .rounds {
      display: grid;
      grid-template-columns: repeat(4, minmax(104px, 1fr));
      gap: 12px;
      min-height: 620px;
    }

    .round {
      min-width: 0;
      position: relative;
    }

    .round-label {
      display: block;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: bold;
      text-align: center;
    }

    .round-grid {
      display: grid;
      grid-template-rows: repeat(16, 1fr);
      height: calc(100% - 22px);
      margin-top: 8px;
    }

    .match {
      position: relative;
      align-self: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      overflow: visible;
    }

    .match::after {
      display: none;
    }

    .team {
      position: relative;
    }

    .round:not(:last-child) .team::after {
      content: "";
      position: absolute;
      top: 50%;
      right: -13px;
      width: 12px;
      height: 1px;
      background: var(--line);
    }

    .round:not(:last-child) .team.is-winner::after {
      background: var(--winner);
    }

    .match.is-winner {
      border-color: var(--winner);
      box-shadow: 0 0 0 2px rgb(197 138 24 / 18%);
    }

    .match-number {
      display: block;
      padding: 4px 7px;
      color: var(--muted);
      background: #f7f4f3;
      border-bottom: 1px solid var(--line);
      font-size: 0.66rem;
    }

    .team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 31px;
      gap: 4px;
      padding: 5px 7px;
      font-size: 0.72rem;
    }

    .team + .team {
      border-top: 1px solid #eee9e9;
    }

    .team-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-score {
      flex: 0 0 auto;
      color: var(--muted);
      font-weight: bold;
    }

    .team.is-winner {
      color: #875d06;
      font-weight: bold;
    }

    .status {
      margin-top: 18px;
      padding: 12px 14px;
      color: var(--muted);
      background: #faf7f6;
      border-left: 3px solid var(--winner);
      font-size: 0.82rem;
    }

    @media (max-width: 900px) {
      body {
        padding: 72px 14px 24px;
      }

      .page-header {
        align-items: start;
        flex-direction: column;
      }

      .bracket-board {
        grid-template-columns: 1fr;
        overflow-x: visible;
      }

      .final-matches {
        grid-template-columns: 1fr;
      }

      .block {
        min-width: 0;
      }
    }

    @media (max-width: 520px) {
      .back-button {
        left: 14px;
      }

      .legend {
        flex-wrap: wrap;
        white-space: normal;
      }

      .rounds {
        grid-template-columns: repeat(4, minmax(82px, 1fr));
        gap: 8px;
        min-height: 560px;
      }

      .block {
        padding: 12px 8px;
      }

      .final-section {
        padding: 12px 8px;
      }

      .team {
        padding: 5px;
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-button">← 戻る</a>
  <main class="page">
    <header class="page-header">
      <div>
        <h1>決勝トーナメント</h1>
        <p>各ブロックの予選勝者による決勝トーナメント</p>
      </div>
      <div class="legend" aria-label="表示の凡例">
        <span><i></i>未確定</span>
        <span class="is-winner"><i></i>勝ち上がり</span>
      </div>
    </header>

    <section id="final-section" class="final-section" aria-labelledby="final-heading"></section>
    <section id="bracket-board" class="bracket-board" aria-label="各ブロック決勝トーナメント"></section>
    <p class="status">出場者とスコアは現在準備中です。確定後、管理者ページから入力すると自動で反映されます。</p>
  </main>

  <script>
    const BLOCKS = ["A", "B", "C"];
    const ROUND_NAMES = ["1回戦", "2回戦", "準々決勝", "準決勝"];
    const SLOT_COUNT = 16;

    // 後でApps ScriptのJSONをここへ渡せるデータ形式にしておく。
    const tournamentData = {
      A: { matches: [] },
      B: { matches: [] },
      C: { matches: [] },
      finalMatches: []
    };

    function getMatch(block, round, matchIndex) {
      return tournamentData[block].matches.find(
        match => match.round === round && match.match === matchIndex
      ) || {};
    }

    function teamMarkup(team) {
      const name = team && team.name ? team.name : "出場者未定";
      const number = team && team.number ? `${team.number}番 ` : "";
      const score = team && team.score !== undefined ? team.score : "";
      const winner = team && team.winner ? " is-winner" : "";

      return `<div class="team${winner}">
        <span class="team-name">${number}${name}</span>
        <span class="team-score">${score}</span>
      </div>`;
    }

    function matchMarkup(block, round, matchIndex) {
      const match = getMatch(block, round, matchIndex);
      const winnerClass = match.winner ? " is-winner" : "";
      const rowStart = (matchIndex - 1) * (2 ** (round + 1)) + 1;
      const rowSpan = 2 ** (round + 1);

      return `<article class="match${winnerClass}" style="grid-row: ${rowStart} / span ${rowSpan};">
        <span class="match-number">第${matchIndex}試合</span>
        ${teamMarkup(match.red)}
        ${teamMarkup(match.blue)}
      </article>`;
    }

    function blockMarkup(block) {
      return `<section class="block" aria-labelledby="block-${block}">
        <div class="block-heading">
          <h2 id="block-${block}">${block}ブロック</h2>
          <span>最大16枠</span>
        </div>
        <div class="rounds">
          ${ROUND_NAMES.map((name, round) => `
            <div class="round">
              <span class="round-label">${name}</span>
              <div class="round-grid">
                ${Array.from({ length: SLOT_COUNT / (2 ** (round + 1)) }, (_, index) =>
                  matchMarkup(block, round, index + 1)
                ).join("")}
              </div>
            </div>
          `).join("")}
        </div>
      </section>`;
    }

    function finalMarkup() {
      const matches = tournamentData.finalMatches || [];

      return `<div class="final-heading">
        <h2 id="final-heading">最終決戦</h2>
        <span>A・B・Cブロック代表の総当たり</span>
      </div>
      <div class="final-matches">
        ${[0, 1, 2].map((index) => {
          const match = matches[index] || {};
          return `<article class="match${match.winner ? " is-winner" : ""}">
            <span class="match-number">第${index + 1}試合</span>
            ${teamMarkup(match.red)}
            ${teamMarkup(match.blue)}
          </article>`;
        }).join("")}
      </div>`;
    }

    function renderTournament(data = tournamentData) {
      Object.assign(tournamentData, data);
      document.getElementById("final-section").innerHTML = finalMarkup();
      document.getElementById("bracket-board").innerHTML = BLOCKS
        .map(blockMarkup)
        .join("");
    }

    renderTournament();
  </script>
</body>
</html>
